    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(layer, 0, 0);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    // v7: the sun/moon streaks lie ON the water, behind everything that sits in or on it
    waterGlow();
    drawMist(false);   // v8: morning mist lying on the water
    // 2b) everything in or on the water on the same layer again, lit the same way
    ctx = layerCtx;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, layer.width, layer.height);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    drawTurtle();
    pads.forEach(p => { if (p.x - camX > -80 && p.x - camX < W + 80) drawPad(p); });
    drawFish(); drawCritters(); drawFrog(); drawTongue(); drawHopHopTry(); drawBuddy(); drawFxBug();
    pads.forEach(p => {
      if (p.bloom > 0 && p.x - camX > -80 && p.x - camX < W + 80) {
        drawFlowerFront(p.x - camX, WATER_Y + 2 + Math.sin(time * 1.6 + p.phase) * 1.4, flowerScale(p), p.color, flowerOpen(p));
      }
    });
    drawParticles(); drawZees(); drawReeds();
    applyLight();
    ctx = mainCtx;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(layer, 0, 0);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    drawMist(true); drawRain();   // v8: a faint wisp of mist in front, and the raindrops
    // 3) things that glow on top: fireflies, lightning bugs
    drawFireflies(); drawGlowBugs();
    drawPopups(); drawTitle(); drawFade();
  }

  // =====================================================================
  //  RUN
  // =====================================================================
  resize();
  computeSky();
  reset();
  pads[0].openAt = -1e9;   // v8: the first flower follows the time of day from the start

  if (RENDER) {
    // The recorder calls these. Each frame moves time forward by exactly 1/fps.
    window.WATCH = {
      config: CFG,
      frame(fps, quality) {
        const steps = 2, dt = 1 / fps / steps;
        for (let i = 0; i < steps; i++) update(dt);
        draw();
        return canvas.toDataURL("image/jpeg", quality);
      },
      // move time forward without drawing (used to resume a recording part-way through)
      skip(fps, frames) {
        const steps = 2, dt = 1 / fps / steps;
        for (let f = 0; f < frames; f++) for (let i = 0; i < steps; i++) update(dt);
        return time;
      },
      async soundtrack(fromT, toT) {
        const { sampleRate, bytes } = await renderSoundtrack(fromT, toT);
        window.__pcm = bytes; // handed over in chunks
        return { sampleRate, length: bytes.length };
      },
      pcmChunk(start, len) {
        const b = window.__pcm.subarray(start, start + len);
        let s = ""; const CH = 0x8000;
        for (let i = 0; i < b.length; i += CH) s += String.fromCharCode.apply(null, b.subarray(i, i + CH));
        return btoa(s);
      },
      stats() { return { cast: window.WATCH_CAST(), time, sounds: soundLog.length, x: frog.x, floats: soundLog.filter(e => e.name === "plop").map(e => Math.round(e.t)), hops: soundLog.filter(e => e.name === "boing").length, gulps: soundLog.filter(e => e.name === "gulp").map(e => Math.round(e.t)), stars: soundLog.filter(e => e.name === "twinkle").map(e => Math.round(e.t)), cuesMissed: CFG.showcase ? CUES.filter(c => !c.done).map(c => c.t) : [],
        // v8
        sky: HOME ? "home" : "legacy", date: `${DATE.y}-${String(DATE.m).padStart(2, "0")}-${String(DATE.d).padStart(2, "0")}`, events: EVENTS,
        fx: CFG.fx, plan: PLAN, visits: VISITS.map(v => ({ kind: v.kind, friend: FRIEND_LOOKS[v.look].name, planned: v.at, started: v.started, ended: v.ended, skipped: v.skipped })),
        clock: clockHour(), moon: SKY ? { phase: SKY.moonPhase } : null }; },
      // v8: drop sounds that are long done, so a 24-hour day doesn't keep every chirp in memory
      forgetSoundsBefore(t) { let k = 0; while (k < soundLog.length && soundLog[k].t < t) k++; if (k) soundLog.splice(0, k); return soundLog.length; },
      fxState() { return buddy ? { kind: buddy.v.kind, phase: buddy.phase, x: Math.round(buddy.x - camX), pad: !!buddy.pad, hop: !!buddy.hop, lick: !!buddy.lick, stay: +buddy.stay.toFixed(1), hopsSeen: buddy.hopsSeen, bug: fxBug ? { t: +fxBug.t.toFixed(1), caught: fxBug.caught } : null, frogX: Math.round(frog.x - camX), face: frog.face, state: frog.state } : null; },
      // v8: what happened between two moments (for the recipe card of each 15-minute file)
      between(a, b) { const L = soundLog.filter(e => e.t >= a && e.t < b); const n = k => L.filter(e => e.name === k).length; return { hops: n("boing"), floats: n("plop"), snacks: n("gulp"), stars: n("twinkle"), friendHops: n("fboing") }; },
      counts() { return { hops: soundLog.filter(e => e.name === "boing").length }; }
    };
    window.WATCH_READY = true;
  } else {
    // Live watching: sound starts on the first tap (a browser rule)
    const soundBtn = document.getElementById("soundBtn"), vol = document.getElementById("vol");
    function startSound() {
      if (actx) return;
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        makeBuses(actx); startPond();
        master.gain.value = Math.pow(vol.value / 100, 2) * 1.4;
        soundBtn.textContent = "Volume"; vol.hidden = false;
      } catch (e) { actx = null; }
    }
    soundBtn.addEventListener("click", startSound);
    document.addEventListener("pointerdown", e => { if (!e.target.closest(".sound")) startSound(); }, { once: true });
    vol.addEventListener("input", () => { if (master) master.gain.setTargetAtTime(Math.pow(vol.value / 100, 2) * 1.4, actx.currentTime, 0.05); });
    document.addEventListener("visibilitychange", () => { if (!actx) return; if (document.hidden) actx.suspend(); else actx.resume(); });
    // tuck the sound control away after a few quiet seconds
    let quietTimer = 0;
    const wake = () => { document.body.classList.remove("quiet"); clearTimeout(quietTimer); quietTimer = setTimeout(() => document.body.classList.add("quiet"), 4000); };
    ["pointermove", "pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, wake, { passive: true }));
    wake();
    // keep the screen awake while watching (where supported)
    async function stayAwake() { try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch (_) {} }
    stayAwake();
    document.addEventListener("visibilitychange", () => { if (!document.hidden) stayAwake(); });
    window.addEventListener("resize", resize);
    let last = performance.now();
    function frame(now) {
      const dt = clamp((now - last) / 1000, 0, 0.05);
      last = now;
      update(dt); draw();
      if (rainGain && actx) rainGain.gain.setTargetAtTime(RAIN_VOL * WXNOW.rain, actx.currentTime, 0.5);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
})();
</script>
<script>
/* website: the full screen button in the top-right corner */
(() => {
  const btn = document.getElementById("fullBtn"), label = document.getElementById("fullLabel"), icon = document.getElementById("fullIcon");
  const root = document.documentElement;
  const can = !!(root.requestFullscreen || root.webkitRequestFullscreen) && (document.fullscreenEnabled !== false || document.webkitFullscreenEnabled);
  if (!can || document.body.classList.contains("render")) return;   // e.g. iPhone Safari: the page already fills the screen
  btn.hidden = false;
  const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  function sync() {
    const on = isFull();
    label.textContent = on ? "Exit full screen" : "Full screen";
    icon.setAttribute("d", on ? "M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" : "M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5");
  }
  btn.addEventListener("click", () => {
    try {
      if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else { const r = (root.requestFullscreen || root.webkitRequestFullscreen).call(root); if (r && r.catch) r.catch(() => {}); }
    } catch (_) {}
  });
  document.addEventListener("fullscreenchange", sync);
  document.addEventListener("webkitfullscreenchange", sync);
  // show the button when the mouse reaches the top-right corner
  const ZONE_W = 220, ZONE_H = 140;
  document.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse") return;
    document.body.classList.toggle("corner", e.clientX > innerWidth - ZONE_W && e.clientY < ZONE_H);
  }, { passive: true });
  document.documentElement.addEventListener("mouseleave", () => document.body.classList.remove("corner"));
  sync();
})();
</script>
