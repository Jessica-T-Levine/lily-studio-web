<script>
  // Website: watch Hop Hop's day LIVE, on the home sky's real clock (Central Time), with the friends and the
  // weather at their real times. (Add ?hour=7 to the link to start at a set hour instead, for checking.)
  (function () {
    if (new URLSearchParams(location.search).has("hour")) return;
    var HS = window.LilyHomeSky, now = new Date();
    var h = HS ? HS.centralHour(Date.now()) : now.getHours() + now.getMinutes() / 60;
    var label = h < 5 ? "Night" : h < 7.5 ? "Sunrise" : h < 11.5 ? "Morning" : h < 16 ? "Afternoon" : h < 18.5 ? "Golden Hour" : h < 20 ? "Sunset" : "Night";
    window.WATCH_CONFIG = { realClock: true, sky: "home", startHour: h, label: "Live · " + label };
  })();
</script>
<script>
(() => {
  "use strict";

  // =====================================================================
  //  Lily's Hop Hop · WATCH MODE (v8: the real home sky, 5 little friends, morning mist, afternoon rain and rainbow, water lilies that open and close · v7: sun and moon streaks sit on the water, behind pads and reeds · v6: creatures from the shared Creature Library; real-time time of day)
  //  The frog lives its life on its own: calm pauses, hops, snacks, naps.
  //  Two ways to run:
  //   1) LIVE  - open the page and watch (tap once for sound).
  //   2) RENDER - the video recorder drives it one frame at a time.
  //  Every random choice comes from a numbered "seed", so the same seed
  //  always makes the exact same episode (at any video size).
  // =====================================================================

  const params = new URLSearchParams(location.search);
  const CFG = Object.assign({
    seed: parseInt(params.get("seed") || "", 10) || Math.floor(Math.random() * 1e9),
    scene: params.get("scene") || "sunset",
    startHour: params.has("hour") ? parseFloat(params.get("hour")) : 18.5,   // clock time the episode starts at (18.5 = 6:30 PM)
    timeScale: parseFloat(params.get("speed") || "1"),  // 1 = real time (keep 1 for episodes; bigger only for quick tests)
    moonPhase: params.has("moon") ? parseFloat(params.get("moon")) : 0.5,     // 0 new moon, 0.25 first quarter, 0.5 full, 0.75 last quarter
    realClock: params.get("clock") === "real",          // live page: follow the viewer's own clock
    label: params.get("label") || "",                   // words under the title, e.g. "Sunset"
    showcase: params.get("showcase") === "1",
    tryFrog: params.get("tryFrog") || "",               // preview an unapproved frog drawing by its name (tests only)           // "look check" reel: every creature and moment appears on a set schedule
    render: params.get("render") === "1",
    width: 3840, height: 2160,
    zoom: parseFloat(params.get("zoom") || "1.3"),   // bigger = closer to the frog (1 = same as the game)
    words: false,          // little speech words like "yum!" (off for calm videos)
    title: params.get("title") !== "0",
    duration: 300,         // seconds (render mode uses this for the fade out)
    // v8
    sky: params.get("sky") || "home",                  // "home" = the real sun and moon of the home sky, "legacy" = the v7 sky
    date: params.get("date") || "",                     // the day the sky follows, "2026-10-01" (empty = today, Central Time)
    fx: params.get("fx") !== "0"                        // friends, mist, rain, rainbow (0 = off, for story checks)
  }, window.WATCH_CONFIG || {});
  const RENDER = CFG.render;
  if (RENDER) document.body.classList.add("render");

  // ---------- seeded randomness ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const R = mulberry32(CFG.seed);

  // ---------- canvas + world size (16:9, same world scale as the game) ----------
  const canvas = document.getElementById("game");
  const mainCtx = canvas.getContext("2d", { alpha: false });
  // the foreground (hills, water, pond life) is drawn on its own layer so it can take the light of the moment
  const layer = document.createElement("canvas");
  const layerCtx = layer.getContext("2d");
  let ctx = mainCtx;
  let W = 1031, H = 580, WATER_Y = 404, FROG_SCREEN_X = 330, scale = 1;
  function resize() {
    let pw, ph;
    if (RENDER) { pw = CFG.width; ph = CFG.height; }
    else {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const r = canvas.getBoundingClientRect();
      pw = Math.round(Math.max(320, r.width) * dpr); ph = Math.round(pw * 9 / 16);
    }
    canvas.width = pw; canvas.height = ph; layer.width = pw; layer.height = ph;
    H = 580 / CFG.zoom; W = H * pw / ph;
    WATER_Y = Math.round(H - Math.max(176 / CFG.zoom, H * 0.32));
    FROG_SCREEN_X = Math.round(W * 0.32);
    scale = pw / W;
    layoutSky();
  }

  // ---------- helpers ----------
  const rand = (a, b) => a + R() * (b - a);
  const pick = arr => arr[Math.floor(R() * arr.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  const PETAL_COLORS = [
    ["#FF9EC3", "#FFD6E6"], ["#FFB38A", "#FFE1CC"], ["#C9A7F0", "#EBDDFF"],
    ["#FFD36E", "#FFF0C2"], ["#8FD3F0", "#D9F2FF"]
  ];

  // =====================================================================
  //  SOUND
  //  Live: plays right away. Render: every sound is written down with its
  //  exact time, then the whole soundtrack is built afterwards, perfectly
  //  in sync with the picture.
  // =====================================================================
  const MIX = { sfx: 0.42, pond: 0.55 };      // calm mix for watching
  let actx = null, master = null, sfxBus = null, pondBus = null, pondStarted = false;
  let schedAt = null;                          // render mode: the time a sound is placed at
  const soundLog = [];                         // render mode: [{t, name, args}]
  const nowT = () => schedAt !== null ? schedAt : actx.currentTime;

  function makeBuses(a) {
    master = a.createGain(); sfxBus = a.createGain(); pondBus = a.createGain();
    sfxBus.gain.value = MIX.sfx; pondBus.gain.value = MIX.pond;
    sfxBus.connect(master); pondBus.connect(master); master.connect(a.destination);
  }
  function tone(type, f1, f2, dur, vol, delay = 0, bus) {
    if (!actx) return;
    const out = bus || sfxBus;
    const t = nowT() + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(out);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    boing() { tone("sine", 260, 720, 0.18, 0.18); },
    bloom(perfect) {
      tone("triangle", 880, 880, 0.16, 0.12);
      tone("triangle", 1320, 1320, 0.2, 0.1, 0.07);
      if (perfect) tone("triangle", 1760, 1760, 0.26, 0.09, 0.14);
    },
    plop() { tone("sine", 520, 90, 0.32, 0.22); tone("sine", 180, 60, 0.25, 0.12, 0.08); },
    bloop() { tone("sine", 240, 520, 0.16, 0.14); },
    twinkle() { tone("sine", 1568, 1568, 0.5, 0.035); tone("sine", 2093, 2093, 0.6, 0.03, 0.12); tone("sine", 2637, 2637, 0.7, 0.025, 0.24); },
    lick() { tone("sine", 900, 1500, 0.07, 0.06); },
    gulp() { tone("sine", 520, 260, 0.12, 0.14); tone("sine", 700, 350, 0.1, 0.08, 0.1); },
    // a soft little songbird far away: two or three gentle chirps
    bird(v, n) {
      const base = 2300 + v * 900;
      for (let i = 0; i < n; i++) {
        const f = base * (1 + 0.08 * Math.sin(i * 2.1 + v * 5));
        tone("sine", f, f * 1.35, 0.09, 0.018, i * 0.16, pondBus);
        tone("sine", f * 1.35, f * 1.1, 0.07, 0.012, i * 0.16 + 0.08, pondBus);
      }
    },
    cricket(f, pulses) { for (let i = 0; i < pulses; i++) tone("sine", f, f * 1.01, 0.035, 0.022, i * 0.055, pondBus); },
    // v8: the little friends (softer and higher than Hop Hop), used only by the friends
    fboing(v) { tone("sine", 340 + v * 40, 900 + v * 80, 0.14, 0.09); },
    fpeep(v) { const f = 1250 + (v || 0) * 90; tone("sine", f, f * 1.25, 0.09, 0.03, 0, pondBus); tone("sine", f * 1.2, f * 1.5, 0.08, 0.025, 0.12, pondBus); },
    flick() { tone("sine", 1100, 1800, 0.06, 0.04); },
    fgulp() { tone("sine", 640, 330, 0.1, 0.08); },
    ribbit() {
      [0, 0.16].forEach(delay => {
        const t = nowT() + delay;
        const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
        o.type = "sawtooth";
        o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(120, t + 0.11);
        f.type = "lowpass"; f.frequency.value = 800;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.05, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
        o.connect(f).connect(g).connect(pondBus);
        o.start(t); o.stop(t + 0.14);
      });
    }
  };
  // every sound goes through here
  function play(name, ...args) {
    if (RENDER) { soundLog.push({ t: time, name, args }); return; }
    if (!actx || actx.state !== "running") return;
    sfx[name](...args);
  }
  // pond ambience: soft breeze + lapping water (the noise itself is not seeded; it's just texture)
  // v8: when a soundtrack is built for a piece of a long day, the breeze and water "sway" (LFOs) are written
  //     out from the day's own clock, so they carry on smoothly from one 15-minute file to the next.
  //     The rain sound follows the rain.
  const RAIN_VOL = 0.024;
  let rainGain = null;
  function lfoCurve(param, base, amp, freq, absT0, dur) {
    const step = 0.05, n = Math.max(2, Math.ceil(dur / step) + 1), c = new Float32Array(n);
    for (let i = 0; i < n; i++) c[i] = base + amp * Math.sin(2 * Math.PI * freq * (absT0 + i * step));
    param.setValueCurveAtTime(c, 0, (n - 1) * step);
  }
  function startPond(absT0, dur) {
    if (!actx || pondStarted) return;
    pondStarted = true;
    const len = actx.sampleRate * 3, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; }
    const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
    const breezeF = actx.createBiquadFilter(); breezeF.type = "lowpass"; breezeF.frequency.value = 420;
    const breezeG = actx.createGain(); breezeG.gain.value = 0.055;
    const offline = absT0 !== undefined;
    let lfo1 = null, lfo2 = null;
    if (offline) lfoCurve(breezeG.gain, 0.055, 0.035, 0.07, absT0, dur);
    else {
      lfo1 = actx.createOscillator(); lfo1.frequency.value = 0.07;
      const lfo1G = actx.createGain(); lfo1G.gain.value = 0.035;
      lfo1.connect(lfo1G).connect(breezeG.gain);
    }
    src.connect(breezeF).connect(breezeG).connect(pondBus);
    const lapF = actx.createBiquadFilter(); lapF.type = "bandpass"; lapF.frequency.value = 850; lapF.Q.value = 0.7;
    const lapG = actx.createGain(); lapG.gain.value = 0.03;
    if (offline) lfoCurve(lapG.gain, 0.03, 0.022, 0.28, absT0, dur);
    else {
      lfo2 = actx.createOscillator(); lfo2.frequency.value = 0.28;
      const lfo2G = actx.createGain(); lfo2G.gain.value = 0.022;
      lfo2.connect(lfo2G).connect(lapG.gain);
    }
    src.connect(lapF).connect(lapG).connect(pondBus);
    src.start(0); if (lfo1) lfo1.start(0); if (lfo2) lfo2.start(0);
    // v8: soft rain (white noise, gently filtered), silent until it rains
    const rlen = actx.sampleRate * 3, rbuf = actx.createBuffer(1, rlen, actx.sampleRate), rd = rbuf.getChannelData(0);
    for (let i = 0; i < rlen; i++) rd[i] = Math.random() * 2 - 1;
    const rsrc = actx.createBufferSource(); rsrc.buffer = rbuf; rsrc.loop = true;
    const hp = actx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 700;
    const lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 5200;
    rainGain = actx.createGain(); rainGain.gain.value = 0;
    rsrc.connect(hp).connect(lp).connect(rainGain).connect(pondBus);
    if (offline && CFG.fx) {
      const step = 0.5, n = Math.max(2, Math.ceil(dur / step) + 1), c = new Float32Array(n);
      for (let i = 0; i < n; i++) c[i] = RAIN_VOL * rainAmt(CFG.startHour + (absT0 + i * step) * CFG.timeScale / 3600);
      rainGain.gain.setValueCurveAtTime(c, 0, (n - 1) * step);
    }
    rsrc.start(0);
  }
  let nextCricket = 1.5, nextRibbit = 12 + R() * 10;
  let nextBird = rand(4, 9);
  function updatePond(dt) {
    nextCricket -= dt; nextRibbit -= dt; nextBird -= dt;
    if (nextCricket <= 0) {
      if (SKY.dusky > 0.3) play("cricket", rand(4100, 4800), 2 + Math.floor(R() * 3));
      nextCricket = rand(0.7, 2.4);
    }
    if (nextRibbit <= 0) { play("ribbit"); nextRibbit = rand(14, 30) * lerp(1, 0.6, SKY.night); }
    if (nextBird <= 0) {
      if (isDay() && SKY.dusky < 0.8) play("bird", rand(0, 1), 2 + Math.floor(R() * 3));
      nextBird = rand(5, 14);
    }
  }

  // Render mode: build the full soundtrack after the picture is done.
  // Returns 16-bit stereo PCM in chunks (base64) so it can be handed to the recorder.
  // v8: a piece in the middle of a long day starts 2 seconds early (so sounds that began just before the
  //     cut carry over), and fades only at the very start and the very end of the whole recording.
  async function renderSoundtrack(fromT, toT, sampleRate = 48000) {
    const pre = fromT > 0.001 ? 2 : 0, start = fromT - pre, dur = toT - start;
    const skipN = Math.round(pre * sampleRate), outN = Math.round((toT - fromT) * sampleRate);
    actx = new OfflineAudioContext(2, skipN + outN, sampleRate);
    makeBuses(actx); pondStarted = false; startPond(start, dur);
    const fadeIn = 2.5, fadeOut = 4;
    master.gain.setValueAtTime(fromT <= 0.001 ? 0 : 1, 0);
    if (fromT <= 0.001) master.gain.linearRampToValueAtTime(1, Math.min(fadeIn, dur));
    if (toT >= CFG.duration - 0.001) {
      master.gain.setValueAtTime(1, Math.max(0, dur - fadeOut));
      master.gain.linearRampToValueAtTime(0, dur);
    }
    soundLog.forEach(e => {
      if (e.t < start - 1 || e.t >= toT) return;
      schedAt = Math.max(0, e.t - start);
      sfx[e.name](...e.args);
    });
    schedAt = null;
    const buf = await actx.startRendering();
    const L = buf.getChannelData(0), Rt = buf.getChannelData(1);
    const pcm = new Int16Array(outN * 2);
    for (let i = 0; i < outN; i++) {
      pcm[i * 2] = Math.max(-1, Math.min(1, L[skipN + i])) * 32767;
      pcm[i * 2 + 1] = Math.max(-1, Math.min(1, Rt[skipN + i])) * 32767;
    }
    return { sampleRate, bytes: new Uint8Array(pcm.buffer) };
  }

  // =====================================================================
  //  THE WORLD (same art as the game)
  // =====================================================================
  let pads, frog, camX, camTarget, charge, charging;
  let particles = [], ripples = [], popups = [], ring = null, zees = [];
  let time = 0;
  function say(x, y, text, big) { if (CFG.words) popups.push({ x, y, text, life: 1.1, big: !!big }); }

  function critterSize() {
    const r = R();
    return r < 0.55 ? 1 + R() * 0.3 : r < 0.88 ? 1.3 + R() * 0.4 : 1.7 + R() * 0.3;
  }
  const reduceMotion = false; // videos always animate fully

  // ---------- THE CAST: which drawing each creature uses ----------
  // Each creature comes from the shared Creature Library (window.LilyCreatures) when the library has it,
  // so a new master design shows up here, in the game, and in every re-recorded video automatically.
  // If the library doesn't have a creature yet, the Watch page uses its own built-in drawing.
  // Drawings only change the LOOK: they never touch the story, so a seed plays out the same either way.
  // CFG.tryFrog can name a not-yet-approved frog drawing (for example "HopHop3D") to preview it in a test video.
  const LIB = () => window.LilyCreatures || null;
  const castFrog = () => (CFG.tryFrog && window[CFG.tryFrog]) || (LIB() && LIB().frog) || null;
  const castBee = () => (LIB() && LIB().bee) || null;
  const beePalName = col => col.name === "Our bee" ? "ours" : col.name.toLowerCase();
  window.WATCH_CAST = () => ({ library: LIB() ? "v" + LIB().version : "none", frog: castFrog() ? "library" : "built-in", bee: castBee() ? "library" : "built-in" });
  // ---------- little bees from the bee game ----------
  // Our bee and her six friends, drawn exactly like the bee game (same shape, face, heart wings and
  // legs, same approved colors from bee-color-guide-v1). Everything is in "bee units"; draw() scales it.
  const Bees = (() => {
    const COLORS = [
      { name: "Our bee", top: "#FFF371", bot: "#FFC921", stripe: "#E58E00", wingBack: "255, 214, 234", wingFront: "255, 228, 242", cheek: "255, 100, 132" },
      { name: "Pink", top: "#FFE2F3", bot: "#FFC4E5", stripe: "#E987B3", wingBack: "255, 225, 240", wingFront: "255, 238, 246", cheek: "255, 90, 140" },
      { name: "Mint", top: "#C8FDF4", bot: "#73DEC7", stripe: "#00B59F", wingBack: "220, 245, 240", wingFront: "236, 252, 248", cheek: "255, 110, 140" },
      { name: "Lavender", top: "#FCE6FF", bot: "#D6B7FC", stripe: "#A881E3", wingBack: "236, 222, 255", wingFront: "244, 236, 255", cheek: "255, 110, 150" },
      { name: "Blue", top: "#D7F3FF", bot: "#67AEEF", stripe: "#307BD0", wingBack: "215, 232, 255", wingFront: "232, 243, 255", cheek: "255, 120, 150" },
      { name: "Peach", top: "#FFE9CB", bot: "#FDAC73", stripe: "#DF7242", wingBack: "255, 222, 210", wingFront: "255, 236, 228", cheek: "255, 100, 120" },
      { name: "Strawberry", top: "#FFE3DC", bot: "#F87D7C", stripe: "#C6515B", wingBack: "255, 214, 224", wingFront: "255, 232, 238", cheek: "255, 196, 206" }
    ];
    // heart wings: both rise from the top of her back and lean backward; the front one is bigger
    function wingPath(big) {
      const L = big ? 25.7 : 20.2, w = big ? 4.9 : 3.8;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-w * 0.9, -L * 0.2, -w * 1.25, -L * 0.75, -w * 0.55, -L * 0.95);
      ctx.quadraticCurveTo(0, -L * 1.05, w * 0.55, -L * 0.95);
      ctx.bezierCurveTo(w * 1.25, -L * 0.75, w * 0.9, -L * 0.2, 0, 0);
      ctx.closePath();
    }
    function wing(back, a, pal) {
      const big = !back;
      const hx = back ? -9.3 : -0.9, hy = back ? -10.7 : -6.7, base = back ? -0.46 : -0.42;
      const one = (ang, alpha) => {
        ctx.save(); ctx.translate(hx, hy);
        ctx.scale(1, Math.cos(ang));
        ctx.rotate(base + Math.sin(ang) * 0.25);
        ctx.globalAlpha *= alpha;
        wingPath(big);
        ctx.fillStyle = back ? `rgba(${pal.wingBack}, 0.5)` : `rgba(${pal.wingFront}, 0.78)`; ctx.fill();
        ctx.lineCap = "round";
        ctx.strokeStyle = back ? "rgba(255, 255, 255, 0.55)" : "rgba(255, 255, 255, 0.95)"; ctx.lineWidth = 1.5;
        wingPath(big); ctx.stroke();
        if (!back) {
          ctx.strokeStyle = "rgba(230, 150, 190, 0.45)"; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(0, -2); ctx.quadraticCurveTo(-1.3, -12, 0, -21); ctx.stroke();
          ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
          ctx.beginPath(); ctx.ellipse(-2.2, -19, 1.4, 3, -0.2, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      };
      if (!reduceMotion) { one(0, 0.16); one(1.32, 0.16); }   // a soft buzz blur at the top and bottom of each beat
      one(a, 1);
    }
    function antenna(bx, by, tx, ty, ball) {
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.quadraticCurveTo(bx + (tx - bx) * 0.35, by + (ty - by) * 0.6, tx, ty);
      ctx.stroke();
      ctx.fillStyle = ctx.strokeStyle;
      ctx.beginPath(); ctx.arc(tx, ty, ball, 0, Math.PI * 2); ctx.fill();
    }
    // her little legs, tucked back while she flies (three near, three far)
    const LEG_X = [-10.2, -4.4, 1.6], KNEE = 2.1, LEG_LEN = 3.9, TUCK_BEND = 0.984;
    function bellyY(x) { const t = (x + 1.4) / 18; return -1 + 12.7 * Math.sqrt(Math.max(0, 1 - t * t)); }
    function legs(far, ph) {
      const col = far ? "#3A2C52" : "#4B3A66";
      ctx.save();
      ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = 1.4;
      LEG_X.forEach((lx, i) => {
        const x = lx + (far ? 1.8 : 0), y = bellyY(x) - (far ? 1.6 : 1.1) - 0.9;
        const sway = reduceMotion ? 0 : Math.sin(time * 6 + i * 0.9 + (far ? 0.6 : 0) + ph);
        const a = 0.6 + sway * 0.06, b = TUCK_BEND + sway * 0.065;
        ctx.save(); ctx.translate(x, y); ctx.rotate(a);
        const lower = LEG_LEN - KNEE, r = 0.5;
        const ex = -Math.sin(b) * lower, ey = KNEE + Math.cos(b) * lower;
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(0, KNEE - r);
        ctx.quadraticCurveTo(0, KNEE, -Math.sin(b) * r, KNEE + Math.cos(b) * r);
        ctx.lineTo(ex, ey); ctx.stroke();
        ctx.translate(ex, ey); ctx.rotate(b);
        ctx.beginPath(); ctx.ellipse(0.45, 0.3, 1.3, 0.92, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      });
      ctx.restore();
    }
    // one flying bee at (x, y): s = size, face = 1 (facing right) or -1, pal = one of COLORS, ph = her own timing
    function draw(x, y, s, face, pal, ph, look) {
      const bob = reduceMotion ? 0 : Math.sin(time * 3 + ph) * 3;
      ctx.save();
      ctx.translate(x, y + bob * s);
      ctx.rotate(face * 0.05 - 0.06);
      ctx.scale(face * s, s);
      const flap = reduceMotion ? 0.3 : (0.5 - 0.5 * Math.cos(time * 34 + ph)) * 1.32;
      wing(true, flap * 0.9, pal);
      legs(true, ph);
      // round body with a soft top-to-bottom shade
      const g = ctx.createLinearGradient(0, -14, 0, 12);
      g.addColorStop(0, pal.top); g.addColorStop(1, pal.bot);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(-1.4, -1, 18, 12.7, 0, 0, Math.PI * 2); ctx.fill();
      // two stripes that curve around her round body
      ctx.save();
      ctx.beginPath(); ctx.ellipse(-1.4, -1, 18, 12.7, 0, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = pal.stripe;
      const band = (l, r) => {
        const top = -14.5, mid = -1, bot = 12.5;
        const ctrl = e => 2 * e[1] - (e[0] + e[2]) / 2;
        ctx.beginPath();
        ctx.moveTo(l[0], top); ctx.quadraticCurveTo(ctrl(l), mid, l[2], bot);
        ctx.lineTo(r[2], bot); ctx.quadraticCurveTo(ctrl(r), mid, r[0], top);
        ctx.closePath(); ctx.fill();
      };
      band([-14.2, -15.9, -12.9], [-10.1, -11.8, -9.0]);
      band([-6.6, -7.6, -6.0], [-2.6, -1.6, -2.8]);
      ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
      ctx.beginPath(); ctx.ellipse(-2, -8.8, 10, 2.9, -0.1, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      legs(false, ph);
      // face: dark eyes with a sparkle (they glance at whatever she's looking at), rosy cheeks, happy smile
      const blink = (time + ph) % 3.6 < 0.12;
      let lx = 0, ly = 0;
      if (look) { const d = Math.hypot(look.x, look.y) || 1; lx = look.x / d * 1.4 * face; ly = look.y / d * 1.4; }
      [[5, -2], [11.5, -2.5]].forEach(([ex, ey]) => {
        ctx.strokeStyle = "#2E2440"; ctx.lineWidth = 1.35; ctx.lineCap = "round";
        if (blink) { ctx.beginPath(); ctx.moveTo(ex - 2.2, ey); ctx.quadraticCurveTo(ex, ey + 1.8, ex + 2.2, ey); ctx.stroke(); }
        else {
          const px = ex + lx * 0.6, py = ey + ly * 0.6;
          ctx.fillStyle = "#2E2440"; ctx.beginPath(); ctx.ellipse(px, py, 2.8, 3.4, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "#FFFFFF"; ctx.beginPath(); ctx.arc(px + 1, py - 1.3, 1.1, 0, Math.PI * 2); ctx.fill();
        }
      });
      ctx.fillStyle = `rgba(${pal.cheek}, 0.75)`;
      ctx.beginPath(); ctx.ellipse(2.6, 3.5, 2.95, 1.75, -0.05, 0, Math.PI * 2); ctx.ellipse(12.45, 2.8, 2.5, 1.45, -0.05, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#2E2440"; ctx.lineWidth = 1.6; ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(7, 5.7); ctx.quadraticCurveTo(8.6, 7.7, 10.2, 5.7); ctx.stroke();
      wing(false, flap, pal);
      // antennae last, so they always show in front of her wings
      ctx.strokeStyle = "#4B3A66"; ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.lineJoin = "round";
      const sway = reduceMotion ? 0 : Math.sin(time * 2.4 + ph) * 0.6;
      antenna(5.5, -9.6, 1.2 + sway, -25.2, 1.7);
      antenna(10.4, -9.4, 17.6 + sway, -23.6, 1.7);
      ctx.fillStyle = "#4B3A66";
      ctx.beginPath(); ctx.arc(5.5, -9.6, 1.1, 0, Math.PI * 2); ctx.arc(10.4, -9.4, 1.1, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    return { COLORS, draw };
  })();

  // ---------- bees, butterflies, dragonflies, lightning bugs ----------
  let critters = [], nextCritter = rand(3, 6), lastCamX = null;
  const BUTTERFLY_COLORS = [["#FF9EC3", "#FFD6E6"], ["#C9A7F0", "#EBDDFF"], ["#FFD36E", "#FFF0C2"], ["#8FD3F0", "#D9F2FF"]];
  function spawnCritter() {
    let roll = R();
    if (!isDay()) roll = 0.77 + roll * 0.23;                       // night: only lightning bugs
    else if (SKY.dusky < 0.35 && roll >= 0.77) roll = roll * 0.77;  // bright midday: no lightning bugs
    const dir = R() < 0.5 ? 1 : -1;
    const x0 = dir > 0 ? -24 : W + 24;
    if (roll < 0.3) {
      // a few little bees buzz by together, each her own color and size (never two the same color)
      const n = 1 + Math.floor(R() * 3), y = rand(150, WATER_Y - 50);
      const cols = Bees.COLORS.slice();
      for (let i = cols.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [cols[i], cols[j]] = [cols[j], cols[i]]; }
      for (let i = 0; i < n; i++) {
        critters.push({ kind: "bee", x: x0 - dir * i * rand(28, 50), baseY: y + rand(-40, 40), y: 0, dir, vx: rand(34, 48), t: rand(0, 10), ph: rand(0, 6), size: critterSize(), col: cols[i] });
      }
    } else if (roll < 0.55) {
      critters.push({ kind: "butterfly", x: x0, baseY: rand(150, WATER_Y - 50), y: 0, dir, vx: rand(26, 38), t: rand(0, 10), size: critterSize(), col: pick(BUTTERFLY_COLORS) });
    } else if (roll < 0.77) {
      critters.push({ kind: "dragonfly", x: x0, baseY: rand(170, WATER_Y - 40), y: 0, dir, t: 0, bob: rand(0, 6), size: critterSize() });
    } else {
      const y = R() < 0.55 ? WATER_Y - rand(60, 110) : rand(200, WATER_Y - 30);
      const n = 2 + Math.floor(R() * 3);
      for (let i = 0; i < n; i++) {
        critters.push({ kind: "bug", x: x0 - dir * i * rand(20, 40), baseY: y + rand(-30, 30), y: 0, dir, vx: rand(14, 22), t: rand(0, 10), size: critterSize() });
      }
    }
  }
  function updateCritters(dt) {
    nextCritter -= dt;
    if (nextCritter <= 0) {
      if (critters.length < 5) spawnCritter();
      nextCritter = rand(5, 12);
    }
    const camShift = lastCamX === null ? 0 : (camX - lastCamX) * 0.5;
    lastCamX = camX;
    critters.forEach(c => {
      if (c.caught) return;
      c.t += dt;
      c.x -= camShift;
      if (c.kind === "butterfly") {
        c.x += c.dir * c.vx * dt;
        c.y = c.baseY + Math.sin(c.t * 1.8) * 16 + Math.sin(c.t * 5.3) * 4;
      } else if (c.kind === "bee") {
        // bumbles along: speeds up and slows down, bobbing and weaving
        c.x += c.dir * c.vx * (0.55 + 0.45 * Math.sin(c.t * 1.4 + c.ph)) * dt;
        c.y = c.baseY + Math.sin(c.t * 2.1 + c.ph) * 14 + Math.sin(c.t * 6.3) * 2.5;
      } else if (c.kind === "dragonfly") {
        const phase = c.t % 1.7;
        const speed = phase < 0.45 ? 190 : 6;
        c.x += c.dir * speed * dt;
        c.y = c.baseY + Math.sin(c.t * 3 + c.bob) * 6 + (phase >= 0.45 ? Math.sin(c.t * 22) * 0.8 : 0);
      } else {
        c.x += c.dir * c.vx * dt;
        c.y = c.baseY + Math.sin(c.t * 1.3) * 12 + Math.cos(c.t * 2.1) * 5;
      }
    });
    critters = critters.filter(c => !c.eaten && (c.caught || (c.dir > 0 ? c.x < W + 60 : c.x > -60)));
  }
  function drawButterfly(c) {
    const flap = 0.25 + Math.abs(Math.sin(c.t * 11)) * 0.75;
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.dir * (c.size || 1), c.size || 1);
    ctx.save(); ctx.scale(flap, 1);
    ctx.fillStyle = c.col[0];
    ctx.beginPath(); ctx.ellipse(-5, -4, 5.5, 4.5, -0.5, 0, Math.PI * 2); ctx.ellipse(5, -4, 5.5, 4.5, 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = c.col[1];
    ctx.beginPath(); ctx.ellipse(-3.5, 2.5, 3.5, 3, 0.4, 0, Math.PI * 2); ctx.ellipse(3.5, 2.5, 3.5, 3, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = "#4B3A66"; ctx.lineWidth = 1.6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(0, 5); ctx.stroke();
    ctx.lineWidth = 0.9;
    ctx.beginPath(); ctx.moveTo(0, -5); ctx.quadraticCurveTo(1, -9, 3, -10); ctx.moveTo(0, -5); ctx.quadraticCurveTo(-1, -9, -3, -10); ctx.stroke();
    ctx.restore();
  }
  function drawDragonfly(c) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.dir * (c.size || 1), c.size || 1);
    const shimmer = 0.35 + Math.abs(Math.sin(c.t * 40)) * 0.3;
    ctx.fillStyle = `rgba(255, 255, 255, ${shimmer})`;
    ctx.beginPath();
    ctx.ellipse(-1, -3, 7, 2.2, -0.35, 0, Math.PI * 2);
    ctx.ellipse(-1, 3, 7, 2.2, 0.35, 0, Math.PI * 2);
    ctx.ellipse(-4, -2.5, 6, 2, -0.6, 0, Math.PI * 2);
    ctx.ellipse(-4, 2.5, 6, 2, 0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#4FB8B4"; ctx.lineWidth = 2.2; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(3, 0); ctx.lineTo(-13, 0.5); ctx.stroke();
    ctx.fillStyle = "#3E9C9A";
    ctx.beginPath(); ctx.arc(4.5, 0, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function drawBug(c) {
    const sz = c.size || 1;
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(sz, sz); ctx.translate(-c.x, -c.y);
    const glow = 0.35 + 0.65 * Math.max(0, Math.sin(c.t * 2.6));
    const g = ctx.createRadialGradient(c.x, c.y + 1, 0, c.x, c.y + 1, 10);
    g.addColorStop(0, `rgba(255, 244, 150, ${0.85 * glow})`);
    g.addColorStop(1, "rgba(255, 244, 150, 0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x, c.y + 1, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255, 238, 120, ${0.6 + 0.4 * glow})`;
    ctx.beginPath(); ctx.ellipse(c.x - c.dir * 1.5, c.y + 1, 2.2, 1.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#4B3A66";
    ctx.beginPath(); ctx.ellipse(c.x + c.dir * 1.5, c.y, 1.8, 1.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.beginPath(); ctx.ellipse(c.x, c.y - 2, 2, 1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function drawCritters() {
    critters.forEach(c => {
      if (c.caught) return;
      if (c.kind === "butterfly") drawButterfly(c);
      else if (c.kind === "bee") {
        const LB = castBee(), s = 0.42 * c.size;
        if (LB) LB.draw(ctx, c.x, c.y + LB.SEAT * s, s, c.dir > 0 ? Math.PI / 2 + 0.35 : -(Math.PI / 2 + 0.35), 0.12,
          { t: time, ph: c.ph, flying: true, pal: beePalName(c.col) });
        else Bees.draw(c.x, c.y, s, c.dir, c.col, c.ph, { x: c.dir, y: 0.15 });
      }
      else if (c.kind === "dragonfly") drawDragonfly(c);
    });
  }
  // lightning bugs are drawn after the lighting, so they glow at night
  function drawGlowBugs() { critters.forEach(c => { if (!c.caught && c.kind === "bug") drawBug(c); }); }

  // ---------- jumping fish ----------
  let fish = [], nextFish = rand(5, 9);
  const FISH_KINDS = ["goldfish", "koi", "stripe"];
  function fishSplash(x) {
    for (let i = 0; i < 9; i++) {
      const a = rand(-Math.PI * 0.9, -Math.PI * 0.1), sp = rand(50, 140);
      particles.push({ x, y: WATER_Y + 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.8, c: i % 2 ? "#E6F7FF" : "#A9DDF0", r: rand(1.4, 2.8), kind: "drop" });
    }
    ripples.push({ x, y: WATER_Y + 5, r: 4, life: 0.9 });
  }
  function clearWater(wx) { return pads.every(p => Math.abs(wx - p.x) > p.r + 34); }
  function spawnFish() {
    const frogScreenX = frog.x - camX;
    for (let tries = 0; tries < 40; tries++) {
      const sx = rand(40, W - 40);
      if (Math.abs(sx - frogScreenX) < 70) continue;
      const dir = R() < 0.5 ? 1 : -1;
      const dx = dir * rand(45, 80);
      const x0 = camX + sx, x1 = x0 + dx;
      if (!clearWater(x0) || !clearWater(x1)) continue;
      fish.push({ kind: pick(FISH_KINDS), size: critterSize() * 0.85, x0, dx, h: rand(55, 85), t: 0, dur: rand(0.95, 1.2), dir, x: x0, y: WATER_Y, angle: 0, landed: false });
      fishSplash(x0);
      return true;
    }
    return false;
  }
  function updateFish(dt) {
    nextFish -= dt;
    if (nextFish <= 0) {
      const jumped = fish.length < 2 && spawnFish();
      nextFish = jumped ? rand(8, 16) : 1.5;
    }
    fish.forEach(f => {
      f.t += dt / f.dur;
      const t = Math.min(f.t, 1);
      f.x = f.x0 + f.dx * t;
      f.y = WATER_Y + 6 - f.h * 4 * t * (1 - t);
      const vx = f.dx, vy = -f.h * 4 * (1 - 2 * t);
      f.angle = Math.atan2(vy, Math.abs(vx));
      if (f.t >= 1 && !f.landed) { f.landed = true; fishSplash(f.x); }
    });
    fish = fish.filter(f => f.t < 1.05);
  }
  function drawOneFish(f) {
    ctx.save();
    ctx.translate(f.x - camX, f.y);
    ctx.scale(f.dir * 1.3 * (f.size || 1), 1.3 * (f.size || 1));
    ctx.rotate(f.angle);
    const wag = Math.sin(time * 18) * 0.25;
    let body, bodyLight, tail, fin;
    if (f.kind === "goldfish") { body = "#FF8F52"; bodyLight = "#FFC08A"; tail = "rgba(255, 170, 110, 0.85)"; fin = "#FFB27A"; }
    else if (f.kind === "koi") { body = "#FFF3EA"; bodyLight = "#FFFFFF"; tail = "rgba(255, 236, 226, 0.9)"; fin = "#FFD9CC"; }
    else { body = "#7FA8EE"; bodyLight = "#B9D2FA"; tail = "rgba(160, 140, 230, 0.85)"; fin = "#A690E6"; }
    ctx.save(); ctx.translate(-10, 0); ctx.rotate(wag);
    ctx.fillStyle = tail;
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-7, -9, -11, -7); ctx.quadraticCurveTo(-7, 0, -11, 7); ctx.quadraticCurveTo(-7, 9, 0, 0);
    ctx.fill(); ctx.restore();
    const g = ctx.createLinearGradient(0, -6, 0, 6);
    g.addColorStop(0, body); g.addColorStop(1, bodyLight);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 0, 12, 6.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.ellipse(0, 0, 12, 6.5, 0, 0, Math.PI * 2); ctx.clip();
    if (f.kind === "koi") {
      ctx.fillStyle = "#FF7A6B";
      ctx.beginPath(); ctx.ellipse(2, -3.5, 4.5, 3, 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-6, 1, 3.2, 2.6, -0.2, 0, Math.PI * 2); ctx.fill();

  // ---------- shooting star ----------
  let star = null, nextStar = rand(20, 40), starTrail = [];

    });
    if (!star) return;
    const k = star.t / star.dur;
    const fade = Math.min(1, k * 5) * Math.min(1, (1 - k) * 4);
    const len = 0.32;
    const tx = star.x - star.vx * len, ty = star.y - star.vy * len;
    const g = ctx.createLinearGradient(tx, ty, star.x, star.y);
    g.addColorStop(0, "rgba(255, 245, 220, 0)");

    ctx.fillStyle = `rgba(255, 255, 255, ${fade})`;

    for (let i = 0; i < 8; i++) { const r = i % 2 === 0 ? 6 : 1.6, a = (i / 8) * Math.PI * 2; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }

  // ---------- rare storybook flyers far away ----------
  let flyers = [], nextFlyer = rand(25, 45), flyerCam = null, lastFlyerKind = null;
  const FLYER_KINDS = ["pig", "unicorn", "bunny"];
  function updateFlyers(dt) {
    nextFlyer -= dt;

      lastFlyerKind = kind;

    const shift = flyerCam === null ? 0 : (camX - flyerCam) * 0.05;
    flyerCam = camX;
    flyers.forEach(f => { f.t += dt; f.x += f.dir * f.speed * dt - shift; f.y = f.baseY + Math.sin(f.t * 1.1) * 10; });

  function drawWing(x, y, t, scaleW) {

  // The flying pig (Jessica's sketch, Sept 28): far legs tucked behind her tummy, near legs in front,

  function pigWing(t) {

  // ---------- turtles ----------
  let turtle = null, nextTurtle = rand(12, 20);
  const SHELLS = [
    { shell: "#7FBF7A", plate: "#5E9E62", rim: "#4E8A58", skin: "#A8D98A" },
    { shell: "#6FB9B0", plate: "#4F9990", rim: "#3F7F78", skin: "#A6DCC9" },

  ];
  function pathClearOfPads(xa, xb, y, size) {
    const top = y - 16 * size;
    if (top > WATER_Y + 34) return true;
    const lo = Math.min(xa, xb) - 22 * size, hi = Math.max(xa, xb) + 22 * size;
    return pads.every(p => p.x + p.r + 18 < lo || p.x - p.r - 18 > hi);
  }
  function spawnTurtle() {
    if (frog.state !== "play") return false;
    for (let tries = 0; tries < 30; tries++) {
      const y = rand(WATER_Y + 24, H - 42);
      const depth = (y - (WATER_Y + 24)) / (H - 42 - (WATER_Y + 24));
      const size = lerp(0.65, 1.35, depth) * rand(0.8, 1.35);
      const dir = R() < 0.5 ? 1 : -1;
      const swim = rand(50, 110) * size;
      const sx = rand(40, W - 40);
      const x0 = camX + sx, x1 = x0 + dir * swim;
      if (x1 - camX < 20 || x1 - camX > W - 20) continue;
      if (!pathClearOfPads(x0, x1, y, size)) continue;
      turtle = { x0, x1, x: x0, y, size, dir, t: 0, total: rand(7, 10), look: pick(SHELLS) };
      ripples.push({ x: x0, y: y + 2, r: 8 * size, life: 1 });
      return true;
    }
    return false;
  }
  function updateTurtle(dt) {

      nextTurtle -= dt;

      return;
    }
    const T = turtle;
    T.t += dt;
    const swimStart = 1.1, swimEnd = T.total - 1.1;
    const k = clamp((T.t - swimStart) / (swimEnd - swimStart), 0, 1);
    T.x = lerp(T.x0, T.x1, k * k * (3 - 2 * k));
    if (T.t >= swimEnd && !T.dove) { T.dove = true; ripples.push({ x: T.x, y: T.y + 2, r: 10 * T.size, life: 1 }); }

  // ---------- sky dressing ----------

  const clouds = Array.from({ length: 9 }, (_, i) => {
    const s = [0.55, 1.35, 0.8, 1.1, 0.65, 1.5, 0.9, 1.2, 0.7][i];
    return { xf: (i + R() * 0.4) / 9, x: 0, yf: R(), y: 0, w: 90 * s, s, a: [0.35, 0.85, 0.5, 0.7, 0.4, 0.9, 0.55, 0.75, 0.45][i] };
  });
  function layoutSky() {
    const skyBottom = Math.max(160, WATER_Y - 200);
    clouds.forEach(c => { c.y = 55 + c.yf * (skyBottom - 55); });
    fireflies.forEach(f => { f.y = 40 + f.yf * (WATER_Y - 70); });
  }

  // ---------- lily pads ----------
  function newPad(x, r) {
    return { x, r, bloom: 0, bloomed: false, perfect: false, phase: R() * Math.PI * 2, color: pick(PETAL_COLORS), notch: rand(-0.6, 0.6), flowerSide: R() < 0.5 ? -1 : 1 };
  }
  let lastGapKind = null;
  function extendPads() {
    let last = pads[pads.length - 1];
    while (last.x < camX + W + 360) {
      const sizeRoll = R();
      const r = sizeRoll < 0.3 ? rand(27, 34) : sizeRoll < 0.75 ? rand(40, 50) : rand(54, 64);
      const kinds = ["short", "medium", "long"].filter(k => k !== lastGapKind);
      const roll = R();
      const kind = kinds.length === 3 ? (roll < 0.3 ? "short" : roll < 0.7 ? "medium" : "long") : kinds[roll < 0.5 ? 0 : 1];
      lastGapKind = kind;
      let gap = kind === "short" ? rand(22, 55) : kind === "medium" ? rand(70, 120) : rand(135, 185);
      gap = Math.min(gap, 312 - last.r - r);
      last = newPad(last.x + last.r + gap + r, r);
      pads.push(last);
    }
    while (pads.length && pads[0].x + pads[0].r < camX - 200) pads.shift();
  }

  // =====================================================================
  //  THE FROG'S LITTLE LIFE (autopilot)
  // =====================================================================
  function reset() {
    pads = [newPad(160, 52)];
    pads[0].bloomed = true; pads[0].bloom = 1; pads[0].flowerSide = -1;
    frog = { x: 160, y: WATER_Y, pad: pads[0], jump: null, glide: null, squash: 0, sink: 0, blink: 0, face: "happy", fromPad: null, wiggle: 0, gulp: 0, lick: null, lookAt: null, state: "play", breathe: 0 };
    ring = null;
    camX = frog.x - FROG_SCREEN_X; camTarget = camX;
    charge = 0; charging = false;
    extendPads();
  }
  function frogIdle() { return frog.state === "play" && !frog.jump && !charging && !frog.glide; }

  // what the frog does next; weighted so it feels alive, never looped
  const brain = { rest: rand(3, 5), plan: null, naps: 0, hopsSinceNap: 0, oopsDue: false };
  function restLength() {
    const r = R();
    return (r < 0.45 ? rand(2.5, 6) : r < 0.85 ? rand(6, 12) : rand(12, 20)) * lerp(1, 1.6, SKY.night);  // calmer at night
  }
  function chooseHop() {
    const ahead = pads.filter(p => p.x > frog.x + 5);
    if (!ahead.length) return null;
    let target = ahead[0];
    // now and then, a big brave hop over a small pad
    if (ahead[1] && R() < 0.14 && ahead[1].x - frog.x <= 318) target = ahead[1];
    if (brain.bigDue && ahead[1] && ahead[1].x - frog.x <= 318) { target = ahead[1]; brain.bigDue = false; }
    let d = target.x - frog.x;
    const r = R();
    let willMiss = false;
    // a rare little oops: somewhere between 1 in 20 and 1 in 10 hops, different every time, so it feels random
    const missChance = rand(0.05, 0.10);
    if (R() < missChance) brain.oopsDue = true;
    if (brain.oopsDue) {
      // a rare little oops: lands in open water between the pads, floats, hops back
      // (if the pads are too close together this time, it waits for a wider gap)
      const edgeA = frog.pad ? frog.pad.x + frog.pad.r * 1.3 + 16 : frog.x + 40;
      const edgeB = target.x - target.r * 1.3 - 16;
      if (edgeB - edgeA > 26) { d = (edgeA + edgeB) / 2 - frog.x; willMiss = true; brain.oopsDue = false; }
    }
    if (!willMiss) d += r < 0.35 ? rand(-4, 4) : rand(-0.6, 0.6) * target.r; // sometimes a perfect center landing
    d = clamp(d, 30, 330);
    return { kind: "hop", charge: (d - 30) / 300 };
  }
  function think(dt) {
    if (!frogIdle()) return;
    if (CFG.title && time < 9.5) return;   // waits politely until the title has faded before the first hop
    if (frog.face === "sleep") {
      brain.rest -= dt;
      if (brain.rest <= 0) { frog.face = "happy"; frog.wiggle = 0.6; frog.squash = 0.5; brain.rest = rand(1.5, 3.5); }
      return;
    }
    if (frog.lick) return;
    brain.rest -= dt;
    if (brain.wiggleDue) { brain.wiggleDue = false; frog.wiggle = 1.1; frog.squash = 0.4; brain.rest = Math.max(brain.rest, 2); return; }
    if (brain.napDue) { brain.napDue = false; frog.face = "sleep"; brain.rest = brain.napLength || 30; brain.hopsSinceNap = 0; return; }
    if (brain.rest > 0) return;
    const r = R();
    // sleepier at night: naps come sooner, happen more often and last longer
    const n = SKY.night;
    if (brain.hopsSinceNap >= Math.round(lerp(6, 2, n)) && r < lerp(0.22, 0.55, n)) {
      frog.face = "sleep"; brain.rest = rand(14, 28) * lerp(1, 2.2, n); brain.hopsSinceNap = 0; return;
    }
    if (r > 0.9) { frog.wiggle = 1.1; frog.squash = 0.4; brain.rest = rand(2, 5); return; } // a happy little wiggle
    const plan = chooseHop();
    if (!plan) { brain.rest = 1; return; }
    brain.plan = plan;
    charging = true; charge = 0;
  }
  function release() {
    charging = false;
    if (frog.glide) { frog.x = frog.glide.to; frog.glide = null; }
    const d = 30 + charge * 300;
    const dur = 0.46 + d / 950;
    frog.jump = { x0: frog.x, d, t: 0, dur, h: 46 + d * 0.32, y0: 0 };
    frog.fromPad = frog.pad;
    frog.pad = null;
    brain.plan = null;
    brain.hopsSinceNap++;
    play("boing");
  }

  // ---------- events ----------
  function burst(x, y, colors, n, spread) {
    for (let i = 0; i < n; i++) {
      const a = rand(-Math.PI, 0), s = rand(60, spread);
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, c: colors[i % colors.length], r: rand(2.5, 5), kind: "petal" });
    }
  }
  function splash(x) {
    for (let i = 0; i < 22; i++) {
      const a = rand(-Math.PI * 0.95, -Math.PI * 0.05), s = rand(80, 240);
      particles.push({ x, y: WATER_Y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, c: i % 2 ? "#E6F7FF" : "#A9DDF0", r: rand(2, 4.5), kind: "drop" });
    }
    ripples.push({ x, y: WATER_Y + 4, r: 6, life: 1 });
    ripples.push({ x, y: WATER_Y + 4, r: 2, life: 1.25 });
  }
  function land(wasReturn) {
    if (wasReturn) {
      const pad = frog.fromPad;
      frog.pad = pad;
      frog.glide = { from: frog.x, to: pad.x, t: 0 };
      frog.squash = 1; frog.face = "happy"; frog.sink = 0;
      frog.state = "play";
      ripples.push({ x: frog.x, y: WATER_Y + 6, r: 10, life: 0.9 });
      brain.rest = rand(3, 6);
      return;
    }
    const lx = frog.x;
    let pad = pads.find(p => Math.abs(lx - p.x) <= p.r);
    let caught = false;
    if (!pad) {
      pad = pads.find(p => Math.abs(lx - p.x) <= p.r + 14 + p.r * 0.3);
      if (pad) { caught = true; frog.x = pad.x + Math.sign(lx - pad.x) * pad.r * 0.8; }
    }
    ripples.push({ x: lx, y: WATER_Y + 6, r: 10, life: 0.9 });
    if (!pad) {
      frog.state = "sinking";
      if (turtle && Math.abs(turtle.x - lx) < 70 * turtle.size + 30 && turtle.t < turtle.total - 1.1) turtle.t = turtle.total - 1.1;
      frog.face = "oops"; frog.sink = 0;
      splash(lx);
      play("plop");
      return;
    }
    frog.pad = pad;
    frog.glide = { from: frog.x, to: pad.x, t: 0 };
    frog.squash = 1;
    brain.rest = restLength();
    if (!pad.bloomed) {
      const perfect = !caught && Math.abs(lx - pad.x) <= pad.r * 0.38;
      pad.bloomed = true; pad.perfect = perfect;
      pad.flowerSide = frog.x > pad.x ? -1 : 1;
      burst(pad.x, WATER_Y - 20, pad.color, perfect ? 18 : 10, perfect ? 200 : 140);
      play("bloom", perfect);
    }
    camTarget = pad.x - FROG_SCREEN_X;
  }

  // ---------- frog feelings: looking around, catching bugs ----------
  let lickCooldown = 3;
  function frogMouth() { return { x: frog.x - camX + 5, y: frog.y - 33 }; }   // used for the catching rules (never changes, so the story stays the same)
  // where the tongue comes out of the frog that is actually drawn
  function mouthPoint() { return castFrog() ? { x: frog.x - camX + 2, y: frog.y - 22 } : frogMouth(); }
  function updateFeelings(dt) {
    frog.wiggle = Math.max(0, (frog.wiggle || 0) - dt);
    frog.gulp = Math.max(0, (frog.gulp || 0) - dt);
    lickCooldown -= dt;
    frog.lookAt = null;
    if (frog.face === "sleep") return;
    if (star) frog.lookAt = { x: star.x, y: star.y };
    else if (frog.lick) frog.lookAt = { x: frog.lick.bug.x, y: frog.lick.bug.y };
    else {
      const m = frogMouth(); let bestD = 230;
      critters.forEach(c => { const d = Math.hypot(c.x - m.x, c.y - m.y); if (d < bestD) { bestD = d; frog.lookAt = { x: c.x, y: c.y }; } });
      fish.forEach(f => { const fx = f.x - camX, d = Math.hypot(fx - m.x, f.y - m.y); if (d < 260 && d < bestD) { bestD = d; frog.lookAt = { x: fx, y: f.y }; } });
      if (!frog.lookAt && turtle) frog.lookAt = { x: turtle.x - camX, y: turtle.y };
      if (!frog.lookAt && flyers.length) frog.lookAt = { x: flyers[0].x, y: flyers[0].y };
    }
    if (!frog.lick && frogIdle() && lickCooldown <= 0 && frog.face === "happy") {
      const m = frogMouth();
      const bug = critters.find(c => c.kind === "bug" && !c.caught && Math.hypot(c.x - m.x, c.y - m.y) < 105 && c.y < WATER_Y - 12);
      if (bug) { bug.caught = true; frog.lick = { bug, t: 0, from: { x: bug.x, y: bug.y } }; play("lick"); }
    }
    if (frog.lick) {
      const L = frog.lick, m = mouthPoint();
      L.t += dt / 0.42;
      if (L.t < 0.5) { const e = L.t / 0.5; L.tip = { x: lerp(m.x, L.from.x, e), y: lerp(m.y, L.from.y, e) }; }
      else { const e = (L.t - 0.5) / 0.5; const k = e * e; L.tip = { x: lerp(L.from.x, m.x, k), y: lerp(L.from.y, m.y, k) }; L.bug.x = L.tip.x; L.bug.y = L.tip.y; }
      if (L.t >= 1) {
        L.bug.eaten = true;
        frog.lick = null;
        frog.gulp = 0.7; frog.squash = 0.6;
        say(frog.x, WATER_Y - 100, "yum!");
        play("gulp");
        lickCooldown = rand(2.5, 5);
        brain.rest = Math.max(brain.rest, rand(1.5, 3));
      }
    }
  }
  function drawTongue() {
    const L = frog.lick; if (!L || !L.tip) return;
    const m = mouthPoint();
    ctx.strokeStyle = "#FF7FA8"; ctx.lineWidth = 3.4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(L.tip.x, L.tip.y); ctx.stroke();
    ctx.fillStyle = "#FF6F9C";
    ctx.beginPath(); ctx.arc(L.tip.x, L.tip.y, 3.8, 0, Math.PI * 2); ctx.fill();
    if (L.t >= 0.5) drawBug(L.bug);
  }
  // sleepy little z's drifting up
  let nextZ = 0;
  function updateZees(dt) {
    if (frog.face === "sleep" && frogIdle()) {
      nextZ -= dt;
      if (nextZ <= 0) { zees.push({ x: frog.x + 22, y: frog.y - 58, t: 0, s: rand(0.8, 1.15) }); nextZ = rand(1.6, 2.4); }
    } else nextZ = 0.6;
    zees.forEach(z => { z.t += dt; z.x += dt * 9; z.y -= dt * 14; });
    zees = zees.filter(z => z.t < 3.2);
  }
  function drawZees() {
    zees.forEach(z => {
      const a = Math.min(1, z.t / 0.5) * Math.min(1, (3.2 - z.t) / 1);
      const s = 5 * z.s * (0.7 + Math.min(z.t, 2) * 0.2);
      const x = z.x - camX + Math.sin(z.t * 2) * 3, y = z.y;
      ctx.save();
      ctx.globalAlpha = a * 0.9;
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.strokeStyle = "rgba(90, 60, 130, 0.35)"; ctx.lineWidth = 4.2;
      ctx.beginPath(); ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y - s); ctx.lineTo(x - s, y + s); ctx.lineTo(x + s, y + s); ctx.stroke();
      ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y - s); ctx.lineTo(x - s, y + s); ctx.lineTo(x + s, y + s); ctx.stroke();
      ctx.restore();
    });
  }

  // ---------- LOOK CHECK director ----------
  // For review reels only: every creature and every frog moment shows up at least once, on a set
  // schedule, so the whole cast can be judged in one short video. Normal episodes stay fully random.
  const SHOW_BUG_Y = () => WATER_Y - 82;
  function showBees(idx, y) {
    const dir = 1;
    idx.forEach((ci, i) => critters.push({ kind: "bee", x: -24 - i * rand(34, 50), baseY: y + rand(-30, 30), y: 0, dir, vx: rand(38, 46), t: rand(0, 10), ph: rand(0, 6), size: [1.1, 1.35, 1.6][i % 3], col: Bees.COLORS[ci] }));
    return true;
  }
  function showOne(kind) {
    const dir = kind === "dragonfly" ? -1 : 1, x0 = dir > 0 ? -24 : W + 24;
    if (kind === "butterfly") critters.push({ kind, x: x0, baseY: rand(170, WATER_Y - 60), y: 0, dir, vx: 32, t: 0, size: 1.4, col: pick(BUTTERFLY_COLORS) });
    else critters.push({ kind, x: x0, baseY: rand(180, WATER_Y - 50), y: 0, dir, t: 0, bob: 0, size: 1.4 });
    return true;
  }
  function showBugs() {   // lightning bugs drifting right past the frog at tongue height
    for (let i = 0; i < 3; i++) critters.push({ kind: "bug", x: -20 - i * 30, baseY: SHOW_BUG_Y() + rand(-12, 12), y: 0, dir: 1, vx: 20, t: rand(0, 10), size: 1.3 });
    return true;
  }
  function showFish(kind) { if (fish.length) return false; if (!spawnFish()) return false; fish[fish.length - 1].kind = kind; return true; }
  function showTurtle(i) { if (turtle || !spawnTurtle()) return false; turtle.look = SHELLS[i]; return true; }
  function showFlyer(kind) {
    if (flyers.length) return false;
    flyers.push({ kind, dir: 1, x: -40, baseY: rand(80, Math.max(130, WATER_Y - 200)), y: 0, t: 0, speed: 40, size: 1.35 });
    return true;
  }
  const CUES = [
    [11, () => showBees([0, 1, 2], 200)],        // our bee, pink, mint
    [16, () => showFish("goldfish")],
    [22, () => showOne("butterfly")],
    [28, () => showTurtle(0)],
    [34, () => showBees([3, 4], 240)],           // lavender, blue
    [40, () => showFlyer("pig")],
    [46, () => showFish("koi")],
    [52, () => showOne("dragonfly")],
    [58, () => { brain.oopsDue = true; return true; }],   // a ring float
    [66, () => showBees([5, 6], 190)],           // peach, strawberry
    [74, () => showFish("stripe")],
    [84, () => showTurtle(1)],
    [92, () => { brain.bigDue = true; return true; }],    // a big brave hop
    [104, () => showFlyer("unicorn")],
    [112, () => showOne("butterfly")],
    [126, () => { brain.wiggleDue = true; return true; }],
    [140, () => showBugs()],                      // the frog catches one with its tongue
    [150, () => showTurtle(2)],
    [165, () => showFlyer("bunny")],
    [178, () => showFish("koi")],
    [190, () => { brain.oopsDue = true; return true; }],  // one more float, in the dusk light
    [205, () => showBugs()],
    [222, () => { nextStar = 0; return true; }], // a shooting star
    [236, () => { brain.napDue = true; brain.napLength = 90; return true; }],  // sleepy under the stars
    [262, () => { nextStar = 0; return true; }]
  ].map(([t, fn]) => ({ t, fn, done: false }));
  function director() {
    nextCritter = nextFish = nextTurtle = nextFlyer = 1e9;           // nothing random, only the schedule
    if (nextStar > 0 && nextStar < 1e8) nextStar = 1e9;
    CUES.forEach(c => { if (!c.done && time >= c.t) c.done = !!c.fn(); });
  }

  // ---------- update ----------
  function update(dt) {
    time += dt;
    computeSky();
    think(dt);
    if (charging) {
      charge += dt * 0.8;
      if (brain.plan && charge >= brain.plan.charge) { charge = brain.plan.charge; release(); }
    }
    if (frog.glide) {
      const gl = frog.glide;
      gl.t = Math.min(1, gl.t + dt / 0.24);
      const e = 1 - Math.pow(1 - gl.t, 3);
      frog.x = lerp(gl.from, gl.to, e);
      if (gl.t >= 1) frog.glide = null;
    }
    if (frog.jump) {
      const j = frog.jump;
      j.t += dt / j.dur;
      const t = Math.min(j.t, 1);
      frog.x = j.x0 + j.d * t;
      frog.y = WATER_Y + j.y0 * (1 - t) - j.h * 4 * t * (1 - t);
      if (!j.returning) camTarget = Math.max(camTarget, frog.x - FROG_SCREEN_X - 40);
      if (j.t >= 1) { const wasReturn = !!j.returning; frog.jump = null; frog.y = WATER_Y; land(wasReturn); }
    }
    if (frog.state === "sinking") {
      const before = frog.sink;
      frog.sink += dt;
      if (before < 0.32 && frog.sink >= 0.32) { frog.face = "float"; play("bloop"); ripples.push({ x: frog.x, y: WATER_Y + 4, r: 8, life: 1 }); }
      if (before < 1.1 && frog.sink >= 1.1) ripples.push({ x: frog.x, y: WATER_Y + 4, r: 20, life: 0.8 });
      if (frog.sink >= 2.6) { // floats a little longer than in the game: it's relaxing
        const back = frog.fromPad;
        ring = { x: frog.x, life: 1 };
        frog.state = "returning";
        frog.face = "happy";
        frog.jump = { x0: frog.x, d: back.x - frog.x, t: 0, dur: 0.62, h: 78, y0: 18, returning: true };
        camTarget = back.x - FROG_SCREEN_X;
        ripples.push({ x: frog.x, y: WATER_Y + 4, r: 12, life: 1 });
        play("boing");
      }
    }
    if (ring) { ring.life -= dt * 0.8; if (ring.life <= 0) ring = null; }
    updateCritters(dt); updateFish(dt); updateFlyers(dt); updateTurtle(dt);
    updateFeelings(dt); updatePond(dt); updateStar(dt); updateZees(dt);
    if (CFG.showcase) director();
    frog.squash = Math.max(0, frog.squash - dt * 4);
    frog.blink = (time % 3.4) < 0.12 ? 1 : 0;
    camX = lerp(camX, camTarget, 1 - Math.pow(0.05, dt)); // a slightly softer camera glide than the game
    extendPads();
    pads.forEach(p => { if (p.bloomed && p.bloom < 1) p.bloom = Math.min(1, p.bloom + dt * 2.2); });
    particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; p.life -= dt * 1.1; });
    particles = particles.filter(p => p.life > 0 && p.y < WATER_Y + 20);
    ripples.forEach(r => { r.r += dt * 55; r.life -= dt * 0.9; });
    ripples = ripples.filter(r => r.life > 0);
    popups.forEach(p => { p.y -= dt * 34; p.life -= dt * 0.9; });
    popups = popups.filter(p => p.life > 0);
    fireflies.forEach(f => { f.p += dt * f.s; });
    // v8: remember when each flower popped open (for the water-lily open/close), then the friends
    pads.forEach(p => { if (p.bloomed && p.openAt === undefined) p.openAt = time; });
    updateFX(dt);
  }

  // =====================================================================
  //  DRAWING
  // =====================================================================
  // =====================================================================
  //  TIME OF DAY (real time: one minute of video = one real minute of sky)
  //  The clock starts at CFG.startHour and moves at real speed, so a 1-hour
  //  episode shows one real hour. The sun rises on the left and sets on the
  //  right; the moon (with its phase) and the stars come out at night.
  //  Live watching on the website can follow the viewer's own clock.
  // =====================================================================
  const DAY = { rise: 6.75, set: 19.25, sunTop: 58, moonTop: 50 };   // the v7 "legacy" sky (kept for story checks)
  // v8: the HOME SKY. The real sun and moon for a named date, from lily-home-sky-v1.js
  // (rounded grid point, Central Time). Time 0 of the video = CFG.startHour on CFG.date, Central clock.
  const HS = window.LilyHomeSky || null;
  const HOME = CFG.sky === "home" && !!HS;
  const DATE = (() => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(CFG.date || "");
    if (m) return { y: +m[1], m: +m[2], d: +m[3] };
    return HS ? HS.centralDate(Date.now()) : { y: 2026, m: 10, d: 1 };
  })();
  const T0_UTC = HOME ? HS.centralToUTC(DATE.y, DATE.m, DATE.d, CFG.startHour) : 0;
  const EVENTS = HOME ? HS.events(DATE.y, DATE.m, DATE.d) : { sunrise: DAY.rise, sunset: DAY.set, moonrise: null, moonset: null };
  const nowUTC = () => (!RENDER && CFG.realClock) ? Date.now() : T0_UTC + time * CFG.timeScale * 1000;
  function clockHour() {
    if (HOME) return HS.centralHour(nowUTC());
    if (!RENDER && CFG.realClock) { const d = new Date(); return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600; }
    return ((CFG.startHour + time * CFG.timeScale / 3600) % 24 + 24) % 24;
  }
  // hours since the day began (6 AM start = 0), used by the friends and the weather. Never wraps.
  const dayClock = () => CFG.startHour + time * CFG.timeScale / 3600;
  // the real sun and moon, worked out once per second of the world (they move far less than a pixel in a second)
  let astroKey = null, astro = null;
  function homeAstro() {
    const ms = nowUTC(), key = Math.floor(ms / 1000);
    if (key !== astroKey) { astroKey = key; astro = HS.at(key * 1000); }
    return astro;
  }
  // where a real body sits on screen: we face south over the pond, so east (rising) is on the left
  // and west (setting) is on the right; its height above the horizon sets how high it is
  function homePos(az, alt, top) {
    const u = (az - 90) / 180;
    const x = W * (0.12 + 0.76 * clamp(u, -0.1, 1.1));
    const horizon = WATER_Y - 26, highest = 64;
    return { x, y: Math.max(34, horizon - (alt / top) * (horizon - highest)) };
  }
  const wrap24 = h => ((h % 24) + 24) % 24;
  // how high a body is (degrees) given the hour, when it rises, and how long it stays up
  function arcAlt(h, rise, up, top, below) {
    const u = wrap24(h - rise) / up;
    if (u <= 1) return top * Math.sin(Math.PI * u);
    return -below * Math.sin(Math.PI * (wrap24(h - rise) - up) / (24 - up));
  }
  const SUN_UP = DAY.set - DAY.rise;
  function sunAlt(h) { return arcAlt(h, DAY.rise, SUN_UP, DAY.sunTop, 40); }
  const moonRise = () => wrap24(DAY.rise + CFG.moonPhase * 24);
  function moonAlt(h) { return arcAlt(h, moonRise(), 12.5, DAY.moonTop, 30); }
  // where a body sits on screen: it travels from low left, over the top, to low right
  function bodyPos(h, rise, up, alt, top) {
    const u = wrap24(h - rise) / up;
    const x = W * (0.12 + 0.76 * clamp(u, -0.1, 1.1));
    const horizon = WATER_Y - 26, highest = 64;
    return { x, y: horizon - (alt / top) * (horizon - highest) };
  }

  // colors by sun height: [alt, sky4, cloud rgb, foreground light (color, strength)]
  const LIGHT = [
    { alt: -18, sky: ["#0A0D29", "#121842", "#1C2257", "#262A63"], cloud: [62, 66, 112], cloudA: 0.55, tint: "#0E1238", tintA: 0.5 },
    { alt: -8,  sky: ["#1D2154", "#3A3978", "#6A4F8E", "#9A6B9A"], cloud: [120, 104, 160], cloudA: 0.8, tint: "#272664", tintA: 0.42 },
    { alt: -2,  sky: ["#5E5AB8", "#A585C8", "#F4A0A0", "#FFC39A"], cloud: [236, 190, 214], cloudA: 1, tint: "#6A4A8A", tintA: 0.12 },
    { alt: 2,   sky: ["#7B6FD0", "#C79BDB", "#FFB0A0", "#FFD1A1"], cloud: [255, 238, 245], cloudA: 1, tint: "#FFFFFF", tintA: 0 },
    { alt: 8,   sky: ["#8A98DC", "#C9B4E2", "#FFCBA0", "#FFE0B0"], cloud: [255, 240, 228], cloudA: 1, tint: "#FFD49C", tintA: 0.13 },
    { alt: 20,  sky: ["#6FA8EE", "#9CC8F6", "#CBE5FB", "#EAF6FF"], cloud: [255, 255, 255], cloudA: 1, tint: "#DDF0FF", tintA: 0.14 },
    { alt: 60,  sky: ["#5B9BEA", "#8DC0F4", "#C0DFFA", "#E4F3FF"], cloud: [255, 255, 255], cloudA: 1, tint: "#E4F4FF", tintA: 0.16 }
  ];
  function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
  LIGHT.forEach(k => { k.skyRgb = k.sky.map(hexToRgb); k.tintRgb = hexToRgb(k.tint); });
  const mix = (a, b, t) => a.map((v, i) => Math.round(lerp(v, b[i], t)));
  const rgb = c => `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
  // everything the picture needs for this moment, worked out once per frame
  let SKY = null;
  function computeSky() {
    const h = clockHour();
    let alt, sunP, moonP, mAlt, moonPhase;
    if (HOME) {
      const a = homeAstro();
      alt = a.sun.alt; mAlt = a.moon.alt; moonPhase = a.moon.phase;
      sunP = homePos(a.sun.az, alt, DAY.sunTop); moonP = homePos(a.moon.az, mAlt, DAY.sunTop);
    } else {
      alt = sunAlt(h); mAlt = moonAlt(h); moonPhase = CFG.moonPhase;
      sunP = bodyPos(h, DAY.rise, SUN_UP, alt, DAY.sunTop); moonP = bodyPos(h, moonRise(), 12.5, mAlt, DAY.moonTop);
    }
    let i = 0;
    while (i < LIGHT.length - 2 && alt > LIGHT[i + 1].alt) i++;
    const A = LIGHT[i], B = LIGHT[i + 1];
    let t = clamp((alt - A.alt) / (B.alt - A.alt), 0, 1); t = t * t * (3 - 2 * t);
    SKY = {
      h, alt,
      sky: A.skyRgb.map((c, k) => rgb(mix(c, B.skyRgb[k], t))),
      cloud: mix(A.cloud, B.cloud, t), cloudA: lerp(A.cloudA, B.cloudA, t),
      tint: mix(A.tintRgb, B.tintRgb, t), tintA: lerp(A.tintA, B.tintA, t),
      night: clamp((-alt - 3) / 12, 0, 1),                 // 0 = daylight, 1 = full night
      dusky: clamp((12 - alt) / 14, 0, 1),                 // golden hour, dusk and night
      sun: Object.assign(sunP, { alt }),
      moon: Object.assign(moonP, { alt: mAlt }),
      moonPhase
    };
  }
  const isDay = () => SKY.alt > -3;

  // =====================================================================
  //  v8: HOP HOP'S LITTLE FRIENDS + THE DAY'S MOMENTS
  //  (morning mist, one gentle afternoon rain, a rainbow, water lilies that open and close)
  //  Everything here uses its OWN random numbers (FXR), never the story's (R), and it never
  //  changes anything Hop Hop does: it only LOOKS at where he is. Hop Hop's hops, floats, naps
  //  and snacks for a seed are exactly the same with it on or off (fx=0).
  //  Times are in "day hours": 6 = 6 AM when the day starts, 24 = midnight, 29.5 = 5:30 AM next day.
  // =====================================================================
  const FXR = mulberry32(((CFG.seed * 2654435761) ^ (DATE.y * 10000 + DATE.m * 100 + DATE.d) ^ 0x51F15EED) >>> 0);
  const frand = (a, b) => a + FXR() * (b - a);
  const smooth01 = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  const frac = x => x - Math.floor(x);
  const SUNRISE = EVENTS.sunrise != null ? EVENTS.sunrise : 7, SUNSET = EVENTS.sunset != null ? EVENTS.sunset : 19;
  function dayHour() {
    if (!RENDER && CFG.realClock) { const h = clockHour(); return h < 6 ? h + 24 : h; }
    return dayClock();
  }
  const inDay = H => ((H - 6) % 24 + 24) % 24 + 6;      // any hour -> the same moment inside 6..30

  // ---------- the day's plan (fixed for a seed + date, drawn in this exact order) ----------
  const PLAN = (() => {
    const p = {};
    p.follow = frand(SUNRISE + 0.55, Math.max(SUNRISE + 0.65, 9.4));
    p.snack = frand(10.3, 11.7);
    p.sit = frand(12.8, 13.9);
    p.rainStart = frand(14.6, 16.2);
    p.rainEnd = p.rainStart + frand(20, 30) / 60;
    p.rainbowHold = frand(8, 12) / 60;
    p.sky = frand(SUNSET - 0.8, SUNSET - 0.45);
    p.wiggle = frand(SUNSET + 0.5, Math.max(SUNSET + 0.6, Math.min(21.3, SUNSET + 1.8)));
    return p;
  })();
  const QUIET_FROM = 22;                                 // no visits from about 10 PM until sunrise

  // ---------- weather: how much of each moment right now (pure math of the hour, 0..1) ----------
  function rainAmt(H) { return smooth01((H - PLAN.rainStart) / (4 / 60)) * (1 - smooth01((H - (PLAN.rainEnd - 5 / 60)) / (5 / 60))); }
  function overcastAmt(H) { return smooth01((H - (PLAN.rainStart - 10 / 60)) / (12 / 60)) * (1 - smooth01((H - PLAN.rainEnd) / (9 / 60))); }
  function rainbowAmt(H) {
    const a = PLAN.rainEnd - 1 / 60, b = a + 4 / 60 + PLAN.rainbowHold;
    return smooth01((H - a) / (4 / 60)) * (1 - smooth01((H - b) / (5 / 60)));
  }
  function mistAmt(H) {
    const h = inDay(H);
    // thick at dawn, thinning from a little after sunrise, gone by about 9 AM;
    // it gathers again in the last hours before 6 AM, so the end of the day meets its start
    return Math.max(1 - smooth01((h - (SUNRISE + 0.2)) / Math.max(0.5, 9 - (SUNRISE + 0.2))), smooth01((h - 28) / 2));
  }
  function lilyOpenAmt(H) {
    const h = inDay(H) % 24;
    return smooth01((h - SUNRISE) / 1.25) * (1 - smooth01((h - (SUNSET - 0.9)) / 1.4));
  }
  let WXNOW = { rain: 0, over: 0, bow: 0, mist: 0, open: 1 };
  function computeWeather() {
    const H = dayHour();
    WXNOW = CFG.fx
      ? { rain: rainAmt(H), over: overcastAmt(H), bow: rainbowAmt(H), mist: mistAmt(H), open: lilyOpenAmt(H) }
      : { rain: 0, over: 0, bow: 0, mist: 0, open: HOME ? lilyOpenAmt(H) : 1 };
  }

  // ---------- the five friends ----------
  // The exact ORIGINAL Hop Hop shapes, about half his size; only the colors and little details change.
  const FRIEND_LOOKS = {
    sprout:   { name: "Soft green", top: "#B6EBAE", body: "#90D98B", dark: "#6DB96F", belly: "#E6FADF", bump: "#A3E19C" },
    blue:     { name: "Blue", top: "#AFD9F8", body: "#7BB9EA", dark: "#4E8FCB", belly: "#E3F2FF", bump: "#96CBF1" },
    yellow:   { name: "Yellow", top: "#FFE696", body: "#F6CD5A", dark: "#D6A437", belly: "#FFF4D6", bump: "#FADB79" },
    pink:     { name: "Pink", top: "#FFC8DB", body: "#F5A2C1", dark: "#CD7399", belly: "#FFE7F0", bump: "#F9B6CE" },
    freckles: { name: "Freckles", top: "#72C381", body: "#57B06C", dark: "#3E8A55", belly: "#CDEFC5", bump: "#66BC78", freckles: true, flower: true }
  };
  const VISITS = [
    { kind: "follow", look: "sprout", at: PLAN.follow },
    { kind: "snack", look: "blue", at: PLAN.snack },
    { kind: "sit", look: "freckles", at: PLAN.sit },
    { kind: "sky", look: "yellow", at: PLAN.sky },
    { kind: "wiggle", look: "pink", at: PLAN.wiggle }
  ].map(v => Object.assign(v, { started: null, ended: null, skipped: false }));
  const FRIEND_S = 1.38 * 0.5;                          // half of Hop Hop
  let buddy = null, fxRipples = [], fxBug = null;
  // Hop Hop's "extras" for a visit: they only change how he is DRAWN (where he looks, a smile, a wiggle)
  const OV = { look: null, smile: 0, wiggle: 0, tongue: null };

  // --- reading Hop Hop (never changing him) ---
  function padNear(x) { return pads.find(p => Math.abs(x - p.x) <= p.r + 14 + p.r * 0.3) || null; }
  function hhLandX() {
    if (charging && brain.plan) return (frog.glide ? frog.glide.to : frog.x) + 30 + brain.plan.charge * 300;
    if (frog.jump) return frog.jump.x0 + frog.jump.d;
    return null;
  }
  function hhBusy() {                                    // pads Hop Hop is on, left, or is about to land on
    const s = new Set();
    if (frog.pad) s.add(frog.pad);
    if (frog.fromPad && frog.state !== "play") s.add(frog.fromPad);
    const lx = hhLandX(); if (lx != null) { const p = padNear(lx); if (p) s.add(p); }
    return s;
  }
  function hhAnchor() {                                  // the pad Hop Hop is on, or about to land on
    const lx = hhLandX();
    if (lx != null) return padNear(lx);                  // null = he's heading for a little float
    return frog.state === "play" ? frog.pad : null;
  }
  const hhAwake = () => frog.face !== "sleep";
  const sx = wx => wx - camX;

  function startVisit(v) {
    const H = dayHour();
    v.started = H;
    const anchor = frog.pad;
    // the friend sits on the pad just ahead of him (always in view, since the camera follows Hop Hop forward)
    const side = 1;
    buddy = {
      v, look: FRIEND_LOOKS[v.look], side, phase: "enter",
      x: camX + (side > 0 ? W + 50 : -50), pad: null, hop: null, face: -side, rest: frand(0.3, 0.8),
      squash: 0, happy: 0, wig: 0, lick: null, gulp: 0, blinkAt: frand(1, 3), blink: 0,
      stay: 0, hopsSeen: 0, lastJump: null, did: false, waited: 0, bob: frand(0, 6)
    };
    if (v.kind === "follow") play("fpeep", 0);
  }
  function padBehind(p) { if (!p) return null; let best = null; pads.forEach(q => { if (q.x < p.x - 1 && (!best || q.x > best.x)) best = q; }); return best; }
  function padAhead(p) { if (!p) return null; return pads.find(q => q.x > p.x + 1) || null; }
  function seatPad() {
    const a = hhAnchor();
    if (!a) return buddy.pad;                            // he's floating: stay put
    const busy = hhBusy();
    let p = buddy.side > 0 ? padAhead(a) : padBehind(a);
    while (p && busy.has(p)) p = buddy.side > 0 ? padAhead(p) : padBehind(p);
    return p;
  }
  // the next pad on the way to a target x (one pad at a time, hopping over any pad Hop Hop needs)
  function nextPadToward(tx) {
    const dir = Math.sign(tx - buddy.x); if (!dir) return null;
    const busy = hhBusy();
    const list = pads.filter(p => (dir > 0 ? p.x > buddy.x + 1 && p.x <= tx + 1 : p.x < buddy.x - 1 && p.x >= tx - 1) && !busy.has(p));
    if (!list.length) return null;
    list.sort((a, b) => dir > 0 ? a.x - b.x : b.x - a.x);
    return list[0];
  }
  function buddyHop(toX, pad) {
    const d = toX - buddy.x;
    buddy.hop = { x0: buddy.x, d, t: 0, dur: 0.42 + Math.abs(d) / 1050, h: 24 + Math.abs(d) * 0.2, pad };
    buddy.face = Math.sign(d) || buddy.face;
    buddy.pad = null;
    if (sx(buddy.x) > -30 && sx(buddy.x) < W + 30) play("fboing", FXR());
  }
  function buddyLanded() {
    const h = buddy.hop;
    buddy.x = h.x0 + h.d; buddy.pad = h.pad; buddy.hop = null; buddy.squash = 1;
    buddy.rest = frand(0.5, 1.1);
    if (buddy.pad) fxRipples.push({ x: buddy.x, y: WATER_Y + 5, r: 5, life: 0.8 });
  }
  function faceHopHop() { buddy.face = frog.x > buddy.x ? 1 : -1; }

  function updateBuddy(dt) {
    const b = buddy, H = dayHour();
    b.squash = Math.max(0, b.squash - dt * 4);
    b.happy = Math.max(0, b.happy - dt); b.wig = Math.max(0, b.wig - dt); b.gulp = Math.max(0, b.gulp - dt);
    b.blinkAt -= dt; if (b.blinkAt <= 0) { b.blink = 0.13; b.blinkAt = frand(2.2, 5.5); } b.blink = Math.max(0, b.blink - dt);
    if (b.hop) {
      b.hop.t += dt / b.hop.dur;
      if (b.hop.t >= 1) buddyLanded();
      return;
    }
    if (b.lick) { updateSnack(dt); return; }
    // never sit where Hop Hop is about to land: hop out of his way first (he "follows")
    if (b.pad && hhBusy().has(b.pad)) {
      const busy = hhBusy();
      let p = b.pad; do { p = b.side > 0 ? padAhead(p) : padBehind(p); } while (p && busy.has(p));
      if (p) { buddyHop(p.x, p); return; }
    }
    b.rest -= dt;
    if (b.phase === "enter") {
      const seat = seatPad();
      if (!seat) { b.phase = "leave"; return; }
      if (b.pad === seat) { b.phase = "stay"; b.stay = 0; faceHopHop(); OV.smile = Math.max(OV.smile, 1.5); b.happy = 1.2; if (b.v.kind !== "follow") play("fpeep", 1); return; }
      if (b.rest > 0) return;
      const n = nextPadToward(seat.x);
      if (n) buddyHop(n.x, n); else { b.phase = "leave"; }
      return;
    }
    if (b.phase === "stay") {
      b.stay += dt;
      const seat = seatPad();
      // count Hop Hop's hops while they're together
      if (frog.jump && frog.jump !== b.lastJump && !frog.jump.returning) { b.lastJump = frog.jump; b.hopsSeen++; }
      if (seat && seat !== b.pad && b.rest <= 0 && !b.lick) {
        // keep beside him: the leader hops on as he gets ready (follow), the others tag along a moment after he lands
        b.lag = (b.lag || 0) + dt;
        const now = b.v.kind === "follow" || (!frog.jump && !charging && b.lag > 0.9);
        if (now) { const n = nextPadToward(seat.x); if (n) { b.lag = 0; buddyHop(n.x, n); return; } }
      } else b.lag = 0;
      if (!b.hop && b.pad) faceHopHop();
      const k = b.v.kind;
      if (k === "follow") { if ((b.hopsSeen >= 5 && b.stay > 120) || b.stay > 300) leave(); }
      else if (k === "snack") updateSnack(dt);
      else if (k === "sit") { if (b.stay > b.v.len) leave(); else if (FXR() < dt / 18) b.happy = 1.4; }
      else if (k === "sky") { if (b.stay > b.v.len) leave(); else if (FXR() < dt / 14) { b.happy = 2; if (hhAwake()) OV.smile = Math.max(OV.smile, 2); } }
      else if (k === "wiggle") {
        if (!b.did) {
          b.waited += dt;
          const ready = frogIdle() && hhAwake() && brain.rest > 1.4 && b.stay > 2;
          if (ready || b.waited > 90) {
            b.did = true; b.wig = 1.2; b.happy = 2; play("fpeep", 2);
            if (ready) { OV.wiggle = 1.1; OV.smile = 2.2; }
            b.stay = 0;
          }
        } else if (b.stay > 30) leave();
      }
      return;
    }
    if (b.phase === "leave") {
      if (sx(b.x) < -40 || sx(b.x) > W + 40) { b.v.ended = H; buddy = null; return; }
      if (b.rest > 0) return;
      const tx = camX + (b.side > 0 ? W + 60 : -60);
      const n = nextPadToward(tx);
      if (n && Math.abs(n.x - b.x) < 340) buddyHop(n.x, n);
      else buddyHop(tx, null);                          // one last hop, out of sight
    }
  }
  function leave() { buddy.phase = "leave"; buddy.rest = frand(0.6, 1.4); buddy.happy = 1; }

  // snack time: a little bug flies between them, they both try, the friend catches it, Hop Hop smiles
  function updateSnack(dt) {
    const b = buddy;
    if (!b.v.bugDone && !fxBug && b.stay > 5) {
      const dir = b.x > frog.x ? -1 : 1;                 // flies in from the friend's far side
      fxBug = { t: 0, dir, x0: sx(b.x) + (b.x > frog.x ? 1 : -1) * 260, y0: WATER_Y - 150, tried: false, caught: false };
    }
    if (fxBug && !fxBug.caught) {
      const B = fxBug; B.t += dt;
      const bx = sx(b.x), by = WATER_Y - 40;
      const k = smooth01(B.t / 5.2);
      B.x = lerp(B.x0, bx + (frog.x > b.x ? 26 : -26), k) + Math.sin(B.t * 3.1) * 10 * (1 - k * 0.6);
      B.y = lerp(B.y0, by - 18, k) + Math.sin(B.t * 4.7) * 8 * (1 - k * 0.6);
      // Hop Hop tries first (only if he's sitting calmly for a moment), and just misses
      if (!B.tried && B.t > 3.3) {
        B.tried = true;
        if (frogIdle() && hhAwake() && !frog.lick && brain.rest > 1) OV.tongue = { t: 0, x: B.x, y: B.y };
      }
      if (B.t > 4.4 && b.pad && !b.hop) {
        B.caught = true;
        b.lick = { t: 0, x: B.x, y: B.y }; play("flick", 0);
      }
    }
    if (b.lick) {
      b.lick.t += dt / 0.4;
      if (b.lick.t >= 0.5 && fxBug) { const m = buddyMouth(); fxBug.x = lerp(b.lick.x, m.x, (b.lick.t - 0.5) * 2); fxBug.y = lerp(b.lick.y, m.y, (b.lick.t - 0.5) * 2); }
      if (b.lick.t >= 1) {
        b.lick = null; fxBug = null; b.v.bugDone = true; b.gulp = 0.7; b.squash = 0.6; b.happy = 1.6;
        play("fgulp", 0);
        if (hhAwake()) OV.smile = Math.max(OV.smile, 2.6);
        b.stay = 0; b.v.after = true;
      }
    }
    if (b.v.after && b.stay > 40) leave();
    if (!b.v.bugDone && b.stay > 90) leave();
  }

  function updateFX(dt) {
    const H = dayHour();
    OV.smile = Math.max(0, OV.smile - dt); OV.wiggle = Math.max(0, OV.wiggle - dt);
    if (OV.tongue) { OV.tongue.t += dt / 0.36; if (OV.tongue.t >= 1 || !frogIdle()) OV.tongue = null; }
    fxRipples.forEach(r => { r.r += dt * 40; r.life -= dt * 0.9; });
    fxRipples = fxRipples.filter(r => r.life > 0);
    if (!CFG.fx) return;
    if (!buddy) {
      const v = VISITS.find(v => v.started === null && !v.skipped && H >= v.at);
      if (v) {
        if (H >= QUIET_FROM || H - v.at > 0.5) v.skipped = true;          // missed its moment (or it's the quiet night)
        else if (frog.state === "play" && !frog.jump && !charging && frog.pad && (hhAwake() || v.kind === "sit" || v.kind === "sky" || v.kind === "wiggle")) {
          v.len = v.kind === "sit" ? frand(100, 150) : v.kind === "sky" ? frand(150, 210) : 0;
          startVisit(v);
        }
      }
    } else updateBuddy(dt);
    // Hop Hop looks at his friend (or at the sunset with his friend) while he's sitting
    OV.look = null;
    if (buddy && buddy.phase !== "enter" || buddy && sx(buddy.x) > 0 && sx(buddy.x) < W) {
      if (buddy.v.kind === "sky" && buddy.phase === "stay") OV.look = { x: SKY.sun.x, y: SKY.sun.y };
      else if (fxBug && !fxBug.caught) OV.look = { x: fxBug.x, y: fxBug.y };
      else OV.look = { x: sx(buddy.x), y: WATER_Y - 20 };
    }
  }

  // ---------- drawing the friend (ORIGINAL shapes, friend colors) ----------
  function buddyScreen() {
    const b = buddy;
    let x = sx(b.x), y = WATER_Y;
