<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lily’s Playhouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
  :root {
    color-scheme: dark;
    --dusk: #2A2046;
    --dusk-deep: #1E1734;
    --cream: #FFF3E8;
    --muted: #C9BDE4;
    --peach: #FFB38A;
    --gold: #FFC94D;
    --blossom: #FF8FB8;
    --card: #342A56;
    --display: "Grandstander", "Chalkboard SE", "Comic Sans MS", ui-rounded, system-ui, sans-serif;
    --body: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, #3A2C5E 0%, var(--dusk) 55%, var(--dusk-deep) 100%);
    background-color: var(--dusk);
    color: var(--cream);
    font-family: var(--body);
    padding-inline: 16px;
    padding-block: 14px 18px;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  h1 {
    font-family: var(--display); font-weight: 800;
    font-size: clamp(28px, 7.5vw, 36px); line-height: 1; margin: 0;
    letter-spacing: -0.01em; color: var(--cream); text-wrap: balance;
  }
  h1 span { color: var(--gold); }
  .tag { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
  .sound {
    flex: none; font: 700 13px/1 var(--body); color: var(--cream);
    background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.18);
    border-radius: 999px; padding: 9px 13px; cursor: pointer;
  }
  .mixer {
    display: grid; grid-template-columns: auto 1fr 2.2em; align-items: center; gap: 10px 12px;
    padding: 14px 16px; background: var(--card); border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 18px; font-size: 14px; font-weight: 700; color: var(--cream);
  }
  [hidden], .mixer[hidden] { display: none !important; }
  .mixer input[type="range"] { width: 100%; min-width: 0; accent-color: var(--gold); height: 28px; }
  .mixer output { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .mixer input:focus-visible, .sound:focus-visible { outline: 3px solid var(--peach); outline-offset: 3px; border-radius: 6px; }
  .stage {
    position: relative; width: 100%; max-width: 100%; aspect-ratio: 400 / 580;
    border-radius: 28px; overflow: hidden;
    box-shadow: 0 18px 40px rgba(10, 6, 24, 0.55), inset 0 0 0 1.5px rgba(255,255,255,0.08);
    background: #8DB6EE; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #game { cursor: default; }
  #game.can-tap { cursor: pointer; }
  #game.dragging { cursor: grabbing; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; -webkit-touch-callout: none; outline: none; }
  canvas:focus-visible { box-shadow: inset 0 0 0 3px var(--peach); }
  .hud {
    position: absolute; top: 14px; left: 16px; right: 16px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; font-family: var(--display);
  }
  .score { font-size: 44px; font-weight: 800; line-height: 1; color: #fff; text-shadow: 0 3px 0 rgba(70, 90, 50, 0.35); font-variant-numeric: tabular-nums; }
  .score small { display: block; font: 800 11px/1.4 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.9); text-shadow: none; }
  .pollen { text-align: right; font: 800 12px/1.4 var(--body); letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.92); }
  .pbar { display: block; width: 78px; height: 8px; margin: 6px 0 0 auto; border-radius: 6px; background: rgba(255, 255, 255, 0.35); overflow: hidden; }
  .pbar i { display: block; height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, #FFE27A, #FFC921); transition: width 0.35s ease; }
  .pollen.full .pbar { box-shadow: 0 0 10px rgba(255, 230, 120, 0.95); }
  .pollen.full b { color: #FFF371; }
  .hivebtn {
    position: absolute; top: 92px; right: 14px; display: flex; align-items: center; gap: 8px;
    padding: 10px 16px 10px 12px; border: 0; border-radius: 999px; cursor: pointer;
    font: 800 14px/1 var(--body); color: #5A3B00; background: #FFC921;
    box-shadow: 0 5px 14px rgba(120, 80, 0, 0.3), inset 0 -3px 0 rgba(160, 100, 0, 0.25);
    animation: hivePulse 1.5s ease-in-out infinite; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  .hivebtn svg { width: 22px; height: 22px; }
  .hivebtn[hidden] { display: none; }
  .hivebtn:focus-visible { outline: 3px solid var(--peach); outline-offset: 3px; }
  @keyframes hivePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @media (prefers-reduced-motion: reduce) { .hivebtn { animation: none; } }
  .pollen b { display: block; font: 800 22px/1 var(--display); letter-spacing: 0; font-variant-numeric: tabular-nums; color: #FFF1B8; text-shadow: 0 2px 0 rgba(160, 100, 20, 0.35); }
  .keyhint {
    position: absolute; left: 16px; right: 16px; bottom: 118px; margin: 0 auto; width: fit-content;
    padding: 10px 18px; border-radius: 999px;
    background: rgba(40, 28, 70, 0.74); color: #FFFFFF; font: 800 14px/1.3 var(--body); text-align: center;
    pointer-events: none; opacity: 0; transition: opacity 0.25s ease;
  }
  .keyhint.show { opacity: 1; }
  /* on-screen buttons for phones and tablets */
  .pad { position: absolute; left: 14px; right: 14px; bottom: 14px; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; }
  .pad[hidden] { display: none; }
  .pad-turn { display: flex; gap: 8px; align-items: flex-end; }
  .pbtn {
    pointer-events: auto; width: 54px; height: 54px; padding: 0; border: 0; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: rgba(255, 255, 255, 0.58); color: #4B3A66; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    box-shadow: 0 4px 12px rgba(40, 30, 80, 0.22), inset 0 -3px 0 rgba(120, 90, 180, 0.16);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    transition: transform 0.08s ease, background 0.12s ease;
  }
  .pbtn svg { width: 26px; height: 26px; }
  .pbtn.small { width: 46px; height: 46px; }
  .pbtn.small svg { width: 27px; height: 27px; }
  .pbtn.on { transform: scale(0.93); background: rgba(255, 241, 184, 0.92); }
  .pbtn.hop { width: 76px; height: 76px; background: rgba(255, 201, 33, 0.88); color: #5A3B00; font: 800 13px/1 var(--body); letter-spacing: 0.04em; }
  .pbtn.hop.on { background: rgba(255, 243, 113, 0.95); }
  .pbtn:focus-visible { outline: 3px solid var(--peach); outline-offset: 2px; }
  .how { margin: 0; font-size: 14px; line-height: 1.5; color: var(--muted); text-align: center; }
  .how b { color: var(--cream); }
  .proto {
    margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted); text-align: center;
    padding: 10px 14px; border: 1.5px dashed rgba(255,255,255,0.18); border-radius: 14px;
  }
  footer { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; font-size: 13px; color: var(--muted); }
  footer a { color: var(--peach); font-weight: 800; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  .clock span { font-size: 30px; }
  .clock small { letter-spacing: 0.08em; }
  .toast {
    position: absolute; left: 50%; top: 78px; transform: translate(-50%, -8px); max-width: calc(100% - 28px);
    padding: 10px 16px; border-radius: 999px; background: rgba(255, 253, 248, 0.96); color: #2E2440;
    font: 700 14px/1.3 var(--body); text-align: center; box-shadow: 0 10px 26px rgba(40, 28, 70, 0.3);
    opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: none;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .toast b { font-family: var(--display); font-weight: 800; }
  .friends { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 0; padding: 0; }
  .friends a, .friends button {
    font: 800 13px/1 var(--body); color: var(--cream); background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.18); border-radius: 999px; padding: 9px 13px; cursor: pointer; text-decoration: none;
  }
  .friends a { background: rgba(255, 201, 33, 0.9); color: #5A3B00; border-color: transparent; }
  .friends a:focus-visible, .friends button:focus-visible { outline: 3px solid var(--peach); outline-offset: 3px; }
  .hud { display: none !important; }   /* no words inside the world */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .corner { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; z-index: 6; }
  .cbtn {
    width: 42px; height: 42px; padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
    background: rgba(255, 255, 255, 0.55); color: #4B3A66; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    box-shadow: 0 4px 12px rgba(40, 30, 80, 0.2); -webkit-tap-highlight-color: transparent;
  }
  .cbtn svg { width: 22px; height: 22px; }
  .cbtn:hover { background: rgba(255, 255, 255, 0.75); }
  .cbtn:focus-visible { outline: 3px solid var(--peach); outline-offset: 2px; }
  #soundBtn .slash { display: none; }
  #soundBtn.muted .slash { display: inline; } #soundBtn.muted .waves { display: none; }
  /* v30: the games menu: a tiny playhouse button, and the animals with games in a column under it */
  .games-btn canvas { width: 34px; height: 34px; display: block; }
  .games-menu { position: absolute; top: 62px; right: 12px; z-index: 6; display: flex; flex-direction: column; gap: 8px; transition: opacity 0.8s ease; }
  .games-menu.fade { opacity: 0; }
  .game-item {
    width: 42px; height: 42px; padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
    background: rgba(255, 255, 255, 0.7); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    box-shadow: 0 4px 12px rgba(40, 30, 80, 0.2); -webkit-tap-highlight-color: transparent;
    animation: gameIn 0.35s ease both;
  }
  .game-item:hover { background: rgba(255, 255, 255, 0.9); transform: scale(1.06); }
  .game-item:focus-visible { outline: 3px solid var(--peach); outline-offset: 2px; }
  .game-item canvas { width: 38px; height: 38px; display: block; }
  @keyframes gameIn { from { opacity: 0; transform: translateY(-8px) scale(0.8); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .game-item { animation: none; } .games-menu { transition: none; } }
  #fullBtn .close { display: none; }
  #fullBtn.on .close { display: inline; } #fullBtn.on .open { display: none; }
  .stage .mixer {
    position: absolute; top: 62px; right: 12px; z-index: 6; width: min(240px, calc(100% - 24px));
    grid-template-columns: 26px 1fr; gap: 6px 10px; padding: 12px 14px;
    background: rgba(52, 42, 86, 0.9); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .stage .mixer output { display: none; }
  .stage .mixer label { display: grid; place-items: center; color: var(--cream); }
  .stage .mixer label svg { width: 22px; height: 22px; }
  .stage.full { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; max-width: none; aspect-ratio: auto; border-radius: 0; z-index: 50; }
  .stage:fullscreen { width: 100vw; height: 100vh; max-width: none; aspect-ratio: auto; border-radius: 0; }
  body.has-full { overflow: hidden; }
  .gopop {
    position: absolute; z-index: 5; transform: translate(-50%, calc(-100% - 10px)); display: flex; align-items: center; gap: 4px;
    padding: 5px 5px 5px 6px; border-radius: 999px; background: rgba(255, 253, 248, 0.97);
    box-shadow: 0 10px 26px rgba(40, 28, 70, 0.32); animation: popIn 0.18s ease-out;
  }
  .gopop[hidden] { display: none; }
  .gopop a {
    font: 800 15px/1 var(--display); color: #FFFFFF; background: #B03B81; text-decoration: none;
    padding: 10px 16px; border-radius: 999px; white-space: nowrap;
  }
  .gopop { padding: 5px; transition: opacity 0.25s ease; }
  .gopop.out { opacity: 0; pointer-events: none; }
  .gopop button {
    width: 32px; height: 32px; border: 0; border-radius: 50%; background: rgba(46, 36, 64, 0.08); color: #2E2440;
    font: 700 18px/1 var(--body); cursor: pointer; padding: 0;
  }
  .gopop a:focus-visible, .gopop button:focus-visible { outline: 3px solid var(--peach); outline-offset: 2px; }
  @keyframes popIn { from { opacity: 0; transform: translate(-50%, calc(-100% - 2px)) scale(0.9); } to { opacity: 1; } }

  /* On the website: the world fills its whole window (the site page around it has the menu and text) */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { padding: 0 !important; background: #8DB6EE !important; }
  .wrap { max-width: none; height: 100%; gap: 0; }
  .stage { width: 100%; height: 100%; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<div class="wrap">

  <div class="stage" id="stage">
    <canvas id="game" tabindex="0" aria-label="Lily's Playhouse, a meadow and a big playhouse where frogs, bunnies and bees live together. Click or tap anywhere to glide there. Tap a friend to visit their game. The same friends can be visited with the buttons below the game."></canvas>
    <div class="corner">
      <button class="cbtn" id="soundBtn" type="button" aria-expanded="false" aria-controls="mixer" aria-label="Sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="none"/><path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="slash" d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></svg></button>
      <button class="cbtn" id="fullBtn" type="button" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="open" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path class="close" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
      <button class="cbtn games-btn" id="gamesBtn" type="button" aria-label="Lily's games" title="Lily's games" aria-expanded="false" aria-controls="gamesMenu"><canvas id="gamesIcon" aria-hidden="true"></canvas></button>
    </div>
    <div class="games-menu" id="gamesMenu" hidden></div>
    <div class="mixer" id="mixer" hidden>
      <label for="sfxVol"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 17.5V6.2l10-2.2v11.3a2.6 2.6 0 1 1-1.6-2.4V7.8L10.6 9.3v8.2A2.6 2.6 0 1 1 9 15z"/></svg><span class="sr">Game sounds</span></label>
      <input type="range" id="sfxVol" min="0" max="100" step="1" value="80">
      <output id="sfxOut" for="sfxVol">80</output>
      <label for="meadowVol"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 4c-9 0-15 4.5-15 11 0 1.5.4 2.8 1 4l1.4-1.4C9.6 13.4 12.6 11 16 9.5c-3.2 2-5.8 4.6-7.6 8.1 1 .5 2.2.8 3.6.8C18.4 18.4 20 11 20 4z"/></svg><span class="sr">Meadow sounds</span></label>
      <input type="range" id="meadowVol" min="0" max="100" step="1" value="50">
      <output id="meadowOut" for="meadowVol">50</output>
    </div>
    <div class="hud">
      <div class="score clock"><span id="clockTime">&nbsp;</span><small id="clockPart">where you are</small></div>
      <div hidden><span id="score">0</span><div id="pollenBox"><span id="pollenLabel"></span><b id="pollen"></b><i id="pollenBar"></i></div></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="gopop" id="goPop" hidden>
      <a id="goLink" href="/hophop/">Play Hop Hop?</a>
    </div>
    <button class="hivebtn" id="hiveBtn" type="button" hidden aria-label="Pollen full. Fly to the hive to drop it off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-3.3 0-6 2.4-6 5.4V9h12v-.6C18 5.4 15.3 3 12 3z" fill="#E5A23A"/><rect x="4.5" y="9" width="15" height="4" rx="2" fill="#F2C46B"/><rect x="3.5" y="13" width="17" height="4.2" rx="2.1" fill="#E5A23A"/><rect x="4.5" y="17.2" width="15" height="3.8" rx="1.9" fill="#F2C46B"/><path d="M10 21v-2.2a2 2 0 0 1 4 0V21z" fill="#5A3A1E"/></svg>
      Fly to the hive
    </button>
    <div class="pad" id="touchPad" hidden>
      <div class="pad-turn">
        <button class="pbtn" type="button" data-turn="left" aria-label="Turn left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="pbtn small" type="button" id="aroundBtn" aria-label="Turn around"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7.5h7a5.25 5.25 0 0 1 0 10.5H7"/><path d="M10.5 4l-3.5 3.5 3.5 3.5"/></svg></button>
        <button class="pbtn" type="button" data-turn="right" aria-label="Turn right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <button class="pbtn hop" type="button" id="hopBtn" aria-label="Hold to wind up, let go to glide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg>go</button>
    </div>
    <div class="keyhint" id="keyHint" aria-hidden="true">Click the game to play with your keyboard</div>
  </div>




</div>

<script src="lily-creatures-v4.js"></script>
<script src="lily-playhouse-design.js"></script>
<script>
(() => {
  "use strict";

  // ---------- setup ----------
  let W = 400, H = 580;
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  const stage = document.getElementById("stage");
  const scoreEl = document.getElementById("score");
  const pollenEl = document.getElementById("pollen");
  const soundBtn = document.getElementById("soundBtn");
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  // The shared Lily Studio creature library draws our 3D bee, her friends and the bunny.
  // If it ever fails to load, the game falls back to the flat drawings below and still works.
  const LC = window.LilyCreatures || null;
  const FROG = (LC && LC.frog) || window.HopHop3D || null;   // Hop Hop: the approved 3D master design from creature library v3 (Sept 29, 2026)
  if (LC) LC.settings.reduceMotion = !!reduceMotion;

  let scale = 1, dpr = 1, dprBest = 1, dprCap = 9;
  function resize() {
    const rect = stage.getBoundingClientRect();
    const vw = Math.max(1, rect.width), vh = Math.max(1, rect.height);
    if (400 * vh / vw >= 580) { W = 400; H = 400 * vh / vw; }
    else { H = 580; W = 580 * vw / vh; }
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    dpr = Math.min(Math.max(dpr, 1.5), 3);
    while (vw * vh * dpr * dpr > 4.2e6 && dpr > 1.25) dpr -= 0.25;   // crisp everywhere, easing off on big screens (an iPad draws far more dots than a phone)
    dprBest = dpr;
    dpr = Math.max(1, Math.min(dpr, dprCap));   // v24: eased off further while frames are slow (see the loop)
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    scale = canvas.width / W;
  }
  window.addEventListener("resize", resize);
  // Full screen: the real thing where the browser allows it; otherwise the world fills the whole window.
  const fullBtn = document.getElementById("fullBtn");
  function setFull(on) {
    stage.classList.toggle("full", on); document.body.classList.toggle("has-full", on);
    fullBtn.classList.toggle("on", on); fullBtn.setAttribute("aria-label", on ? "Leave full screen" : "Full screen");
    try {
      if (on && !document.fullscreenElement && stage.requestFullscreen) stage.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
      if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
    } catch (_) {}
    setTimeout(resize, 80); setTimeout(resize, 400);
  }
  fullBtn.addEventListener("click", e => { e.stopPropagation(); setFull(!stage.classList.contains("full")); });
  fullBtn.addEventListener("pointerdown", e => e.stopPropagation());
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && stage.classList.contains("full")) setFull(false); else resize(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && stage.classList.contains("full")) setFull(false); });
  window.addEventListener("orientationchange", () => setTimeout(resize, 250));

  // ---------- storage (safe) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } }
  };
  // pollen fills up with every bloom; at 10 she can fly it to the hive. The score is how many hive trips she's made.
  const POLLEN_FULL = 10;

  function land(h) {

      }[c.kind];

      if (c.kind === "puff" && !o.puffed) {

  // ---------- update ----------
  function update(dt) {
    time += dt;
    HOUR = hourNow();
    if (trip) updateTrip(dt);
    // winding up: the meter fills, then gently empties, then fills again (like Hop Hop)
    if (charging) {
      charge += chargeDir * dt * 0.8;
      if (charge >= 1) { charge = 1; chargeDir = -1; }
      if (charge <= 0) { charge = 0; chargeDir = 1; }
    }
    let turn = 0;
    keys.forEach(k => { turn += TURN_KEYS[k] || 0; });
    if (turn && !bee.hop) {
      bee.aim += turn * 1.7 * dt;
      camYawTarget = bee.aim;   // steering with the keys: the view turns with her
      lastTurnAt = time;
    }
    if (bee.hop) {
      const h = bee.hop;
      if (h.kind === "perch" && h.perch.kind === "turtle") { const T = h.perch.o; h.x1 = T.x; h.y1 = T.y; h.z1 = turtleTop(T); }
      if (h.kind === "perch" && h.perch.kind === "frog") { const Fr = h.perch.o; h.x1 = Fr.x; h.y1 = Fr.y; h.z1 = frogTop(Fr) + Fr.hop; }
      if (h.paused || h.back) {
        h.pt += dt;
        if (h.paused) {
          h.pe = Math.min(1, h.pe + dt * 2.2);
          h.lookYaw += ((reduceMotion ? 0 : 0.42) + turn * 1.7) * dt;   // the view slowly circles her
          camYawTarget = h.lookYaw;
          bee.wiggle = Math.max(bee.wiggle, 0.35);                          // happy, wiggly buzzing
        } else {
          h.pe = Math.max(0, h.pe - dt * 2.6);
          h.bt += dt;
          if ((h.pe <= 0 && Math.abs(angDiff(camYaw, h.yaw0)) < 0.2) || h.bt > 1.1) { h.back = false; h.pe = 0; }
        }
      } else h.t += dt / h.dur;
      const t = h.kind === "glide" ? smooth(Math.min(h.t, 1)) : Math.min(h.t, 1);
      bee.x = lerp(h.x0, h.x1, t); bee.y = lerp(h.y0, h.y1, t);
      bee.z = lerp(h.z0, h.z1, t) + h.peak * 4 * t * (1 - t);
      if (h.pe > 0) {   // little loops in the air, easing in and out
        const e = h.pe * h.pe * (3 - 2 * h.pe), R = reduceMotion ? 6 : 22, a = h.pt * 1.7;
        bee.x += (Math.cos(a) - 1) * R * e; bee.y += Math.sin(a) * R * 0.8 * e;
        bee.z += e * (8 + (reduceMotion ? 0 : Math.sin(h.pt * 3.1) * 5));
      }
      // pollen sparkles trail behind her in the air
      if (!h.paused && !h.back && Math.random() < dt * 26) {
        particles.push({ x: bee.x + rand(-4, 4), y: bee.y + rand(-4, 4), z: bee.z + 14 + rand(-4, 4), vx: 0, vy: 0, vz: 0, life: 0.8, c: "#FFE27A", r: rand(1.4, 2.4), kind: "dot" });
      }
      if (h.t >= 1) { bee.hop = null; land(h); }
    }
    // she turns (on screen) to face the way she's aiming
    const rel = Math.sin(angDiff(bee.aim, camYaw));
    if (Math.abs(rel) > 0.2) bee.face = Math.sign(rel);
    updateIdle(dt);
    if (idle.face) bee.face = idle.face;
    if (bee.hop && bee.hop.faceBack != null && !bee.hop.paused) bee.face = bee.hop.faceBack;   // after a pause she keeps facing the way she was going
    if (bee.hop && bee.hop.paused && bee.hop.pe > 0.3) {
      const h = bee.hop, q = proj(bee.x, bee.y, bee.z);
      if (q && h.lastSx != null && Math.abs(q.x - h.lastSx) > dt * 6) bee.face = Math.sign(q.x - h.lastSx) * FACE_DIR;
      h.lastSx = q ? q.x : null;
    }
    bee.faceS = lerp(bee.faceS, bee.face, 1 - Math.exp(-dt * 12));
    // 3D: which way she faces compared to the camera. Flying, aiming and turning: the way she's going.
    // Resting: she turns partway toward you so you can see her face.
    {
      const h = bee.hop;
      let want;
      if (h && (h.paused || h.back)) want = bee.face * (Math.PI / 2 + 0.25);
      else if (h || charging || trip || time - lastTurnAt < 1.6) want = angDiff(bee.aim, camYaw);
      else if (idle.face) want = idle.face * (Math.PI / 2 + 0.35);
      else want = bee.face * (Math.PI / 2 + 0.6);
      bee.relYaw += angDiff(want, bee.relYaw) * (1 - Math.exp(-dt * (h || charging ? 12 : 5)));
    }
    bee.wiggle = Math.max(0, bee.wiggle - dt);
    bee.happy = Math.max(0, bee.happy - dt);
    bee.oops = Math.max(0, bee.oops - dt);
    bee.squash = Math.max(0, bee.squash - dt * 4);
    // legs: tuck up in the air, settle down to sit when she lands
    const aloft = !!bee.hop || idle.flying;
    bee.tuck += ((aloft ? 1 : 0) - bee.tuck) * Math.min(1, dt * 7);
    bee.seat += ((aloft ? 0 : 1) - bee.seat) * Math.min(1, dt * 5);
    updateBuzz(bee.hop ? (bee.hop.paused ? 0.75 : 1) : idle.flying ? 0.55 : charging ? 0.15 + charge * 0.35 : 0);

    // camera: swings around behind her after each hop, and stays near her eye level
    camYaw += angDiff(camYawTarget, camYaw) * (1 - Math.exp(-dt * 2.2));
    camC = Math.cos(camYaw); camS = Math.sin(camYaw);

    camY = lerp(camY, bee.y - camS * CAM_DIST, kc);

      if (p && p.frogs && p.frogs.length && !p.said) {

    updateAuto(dt);
    updateMover(dt);
    updatePals(dt);
    updateFriend(dt);
    updateStar(dt);
    updateFlyers(dt);
    updateSkyLife(dt);
    updatePondLife(dt);
    updatePondTurtles(dt);
    updatePondFrogs(dt);
    if (bee.perch && bee.perch.isTurtle && !bee.hop) { const T = bee.perch; bee.x = T.x; bee.y = T.y; bee.z = turtleTop(T); bee.floating = false; }

    updateBreeze(dt);

    if (meadowWind && actx) meadowWind.gain.setTargetAtTime(0.06 + 0.07 * breezeAt(bee.x, bee.y), actx.currentTime, 0.4);   // the breeze whooshes softly

      bee.z = 0.6 + Math.sin(time * 2.2) * 1.2;
      if (time - bee.lastRipple > 1.4) { bee.lastRipple = time; ripples.push({ x: bee.x, y: bee.y, r: 18, life: 0.9 }); }
    }
    ripples.forEach(rp => { rp.r += dt * 28; rp.life -= dt * 0.7; });
    ripples = ripples.filter(rp => rp.life > 0);
    const here = biomeOf(Math.floor(bee.x / CS), Math.floor(bee.y / CS));
    if (here !== area) { areaBanner = { text: area === null ? "Lily’s Playhouse" : AREA_NAMES[here], t: area === null ? -0.6 : 0, first: area === null }; area = here; }
    if (areaBanner) { areaBanner.t += dt; if (areaBanner.t > 3.6) areaBanner = null; }

    particles.forEach(p => {
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      if (p.kind === "seed") {
        // dandelion seeds drift on a gentle breeze

        p.vx = lerp(p.vx, 14 + Math.sin(p.tw * 1.3) * 10, dt * 0.6); p.vy = lerp(p.vy, Math.cos(p.tw) * 10, dt * 0.6);

        p.life -= dt * 0.25;
        return;
      }
      if (p.kind === "dust" || p.kind === "star") {
        p.vx *= Math.pow(0.2, dt); p.vy *= Math.pow(0.2, dt); p.vz = p.vz * Math.pow(0.3, dt) + 14 * dt; p.tw += dt * 14;
      } else if (p.kind === "leaf") {
        p.tw = (p.tw || 0) + dt;
        p.vx = Math.sin(p.tw * 3) * 25; p.vz = -28; p.rot += dt * 2.5;
        if (p.z < 0) { p.z = 0; p.vz = 0; p.vx = 0; p.vy = 0; }
        p.life -= dt * 0.35;
        return;
      } else if (p.kind === "petal") {
        p.vx *= Math.pow(0.25, dt); p.vy *= Math.pow(0.25, dt); p.vz -= 260 * dt;
        if (p.z < 0) { p.z = 0; p.vz = 0; }
        p.rot += dt * 3;
      }
      p.life -= dt * 1.1;
    });
    particles = particles.filter(p => p.life > 0);
    popups.forEach(p => { p.z += dt * 30; p.life -= dt * 0.9; });
    popups = popups.filter(p => p.life > 0);

  }

  // ---------- light: the meadow drifts from golden afternoon to sunset, dusk and dawn ----------
  // ---------- light and sky follow the visitor's real clock ----------
  // Each key is an hour of the day. The sky has four colors (top to horizon); the light is a soft
  // tint laid over the whole meadow (color and strength).
  const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
  const SKY_KEYS = [
    [0,    ["#12133A", "#1B1D4A", "#27285B", "#35306A"]],   // night
    [4.8,  ["#171A48", "#2A2C66", "#4A4380", "#7A5E92"]],   // before dawn
    [6.2,  ["#6D78CF", "#B79CE0", "#F7A9B8", "#FFCFB0"]],   // dawn
    [8,    ["#7FB2EA", "#A9CDF2", "#CFE3F6", "#F4E9DC"]],   // morning
    [12.5, ["#8DB6EE", "#B7D2F4", "#FFE6C2", "#FFE2B0"]],   // midday (the bee game's sky)
    [16.2, ["#8DB6EE", "#B7D2F4", "#FFE6C2", "#FFE2B0"]],   // afternoon
    [18.2, ["#7B6FD0", "#C79BDB", "#FFB0A0", "#FFD1A1"]],   // sunset
    [19.5, ["#4E4A9A", "#8A6CB8", "#D98FA8", "#F2B39A"]],   // dusk
    [21,   ["#1E1F4A", "#2E2C66", "#4A3F7A", "#5E4A86"]],   // evening
    [24,   ["#12133A", "#1B1D4A", "#27285B", "#35306A"]]
  ].map(k => [k[0], k[1].map(hexRgb)]);
  const LIGHT_KEYS = [
    [0, [18, 20, 64, 0.46]], [4.8, [30, 28, 90, 0.4]], [6.2, [255, 188, 175, 0.1]], [8, [255, 230, 200, 0.03]],
    [12.5, [255, 214, 140, 0.02]], [16.2, [255, 214, 140, 0.04]], [18.2, [255, 150, 165, 0.1]],
    [19.5, [60, 50, 140, 0.26]], [21, [22, 22, 72, 0.42]], [24, [18, 20, 64, 0.46]]
  ];
  const RISE = 6.3, SET = 19.2;   // sunrise and sunset
  const SKY_MID = -Math.PI / 2 + 0.45, SKY_SPREAD = 0.7;   // the sun and moon arc across the sky you see when you arrive (v24: to the right of the playhouse, so its roof doesn't hide them)
  let testHour = null;            // add #h7 or #h21.5 to the link to see that hour (for checking)
  try { const mh = /^#h(\d{1,2}(\.\d+)?)/.exec(location.hash); if (mh) testHour = parseFloat(mh[1]) % 24; } catch (_) {}
  let testMoon = null;            // add &m90 to the link to see the moon at that angle from the sun (0 new, 90 half, 180 full)
  try { const mm = /[#&]m(\d{1,3}(\.\d+)?)/.exec(location.hash); if (mm) testMoon = parseFloat(mm[1]) % 360; } catch (_) {}
  function hourNow() {
    if (testHour !== null) return testHour;
    const d = new Date(); return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
  }
  let HOUR = hourNow();
  const smooth = t => t * t * (3 - 2 * t);
  function keyAt(keys) {
    let i = 0;
    while (i < keys.length - 2 && keys[i + 1][0] <= HOUR) i++;
    const a = keys[i], b = keys[i + 1];
    return { a: a[1], b: b[1], t: smooth(clamp((HOUR - a[0]) / (b[0] - a[0]), 0, 1)) };
  }
  // 0 in daylight, 1 in the middle of the night
  function nightness() {
    const h = HOUR;
    if (h >= RISE + 1.2 && h <= SET - 0.4) return 0;
    if (h > SET - 0.4 && h < SET + 2) return smooth((h - (SET - 0.4)) / 2.4);
    if (h > RISE - 1.3 && h < RISE + 1.2) return 1 - smooth((h - (RISE - 1.3)) / 2.5);
    return 1;
  }
  // how golden the light is, around sunrise and sunset
  function goldness() {
    const h = HOUR, g1 = Math.max(0, 1 - Math.abs(h - (SET - 0.6)) / 1.6), g2 = Math.max(0, 1 - Math.abs(h - (RISE + 0.4)) / 1.4);
    return Math.max(g1, g2 * 0.7);
  }
  function lightNow() { const k = keyAt(LIGHT_KEYS); return k.a.map((v, j) => lerp(v, k.b[j], k.t)); }
  function duskAmount() { return clamp(nightness() + goldness() * 0.25, 0, 1); }   // lightning bugs, crickets and stars come out
  function skyColors() {
    const k = keyAt(SKY_KEYS);
    return k.a.map((ca, i) => { const cb = k.b[i]; return `rgb(${Math.round(lerp(ca[0], cb[0], k.t))}, ${Math.round(lerp(ca[1], cb[1], k.t))}, ${Math.round(lerp(ca[2], cb[2], k.t))})`; });
  }
  // the sun crosses the sky from sunrise to sunset, and the moon crosses it at night
  function drawSunMoon() {

    for (let i = 0; i < 22; i++) {
      const sp = 10 + (i % 5) * 4, span = H * 0.9;
      const y = H * 0.95 - ((time * sp + i * 97) % span), x = ((i * 53) % W) + Math.sin(time * 0.7 + i) * 14 - yaw * (50 + (i % 3) * 40);
      const a = 0.35 + 0.35 * Math.sin(time * 2 + i * 1.3), r = 1.3 + (i % 3) * 0.7;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4);
      g.addColorStop(0, `rgba(255, 236, 150, ${a})`); g.addColorStop(1, "rgba(255, 236, 150, 0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 4, 0, Math.PI * 2); ctx.fill();
    }
  }
  // soft, out-of-focus flowers right up close in the bottom corners (they slide the most)
  function drawTripForeground(yaw) {
    const off = -yaw * 260;
    [[-0.02, 1.0, 34, ["#FFC2DA", "#FF9CC0"]], [1.03, 0.98, 30, ["#DCCBFF", "#B79BF5"]]].forEach(([fx, fy, r, col], i) => {
      ctx.save(); ctx.globalAlpha *= 0.92;
      drawTripDaisy(W * fx + off, H * fy + r * 2.4, r, col, i + 5);
      ctx.restore();
    });
    // bokeh: blurry sparkles of light near the lens
    for (let i = 0; i < 6; i++) {
      const x = ((i * 89 + 20) % W) + off * 0.8, y = H * (0.12 + (i * 0.13) % 0.8), r = 10 + (i % 3) * 7;
      const a = 0.1 + 0.07 * Math.sin(time * 0.9 + i);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(255, 250, 230, ${a})`); g.addColorStop(0.7, `rgba(255, 250, 230, ${a * 0.8})`); g.addColorStop(1, "rgba(255, 250, 230, 0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  }
  function drawHiveScene(hx, baseY, Wh, glow, yaw = 0) {
    const tw = Wh * 0.46, tx = hx + Wh * 0.5 + tw * 0.32;
    drawTripTrunk(tx, tw, yaw);
    drawTripBranch(hx - Wh * 0.85, tx - tw * 0.3, baseY + Wh * 0.06, Wh * 0.15);
    const midY = baseY - Wh * 0.55;
    const door = drawTripHive(hx, baseY, Wh, glow, yaw, () => tripBuzzers(hx, midY, Wh, false), () => {});
    drawTripCanopy(tx, Wh, yaw);
    door.front = () => tripBuzzers(hx, midY, Wh, true);
    return door;
  }
  function drawTrip() {
    const T = trip, t = T.t;
    const alpha = t < TRIP.fadeIn ? ease(t / TRIP.fadeIn) : t > TRIP.flyOff ? 1 - ease(seg(t, TRIP.flyOff, TRIP.end)) : 1;
    ctx.save(); ctx.globalAlpha = alpha;
    // the camera eases in as she arrives, then drifts slowly from side to side (so you feel the depth)
    const yawT = reduceMotion ? 0 : 0.16 * Math.sin(t * 0.5 - 0.4);
    const zoom = reduceMotion ? 1 : 1.12 - 0.12 * ease(seg(t, 0, TRIP.arrive));
    ctx.translate(W / 2, H * 0.55); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -H * 0.55);
    drawTripBackdrop(yawT);
    drawTripMeadow(yawT);
    const Wh = Math.min(W * 0.52, H * 0.34), hx = W * 0.4 - yawT * 90, baseY = H * 0.62;
    const glow = t > TRIP.walkIn - 0.1 && t < TRIP.inside + 0.3 ? Math.sin(seg(t, TRIP.walkIn - 0.1, TRIP.inside + 0.3) * Math.PI) : 0;
    const door = drawHiveScene(hx, baseY, Wh, glow, yawT);
    const s = door.dw / 40;   // bee size in this scene
    const sill = { x: door.doorX, y: door.doorY + 4 };
    // two friends wait by the door
    const greetK = t > TRIP.arrive && t < TRIP.greet ? 1 : t > TRIP.walkOut && t < TRIP.wiggle ? 1 : 0;
    [-1, 1].forEach((side, i) => {
      const fx = hx + side * door.dw * 1.9 + Math.sin(time * 1.3 + i) * 5, fy = door.doorY - door.dh * 1.1 + Math.sin(time * 2.1 + i * 2) * 5;
      if (LC) LC.bee.draw(ctx, fx, fy, s * 0.9, -side * (Math.PI / 2 + 0.45), 0.15, { t: time, ph: 1.3 + i, pal: T.pals[i], flying: true, lift: 0, wiggle: greetK ? 1 : 0, happy: greetK ? 1 : 0 });
      else drawBee(fx, fy, { size: s * 0.9, lift: 0, noShadow: true, faceS: -side, vx: 0, wiggle: greetK ? 1 : 0, happy: greetK ? 1 : 0, look: null, ph: 1.3 + i, pal: T.pals[i], flying: true });
    });
    // our bee
    let bx, by, flying = true, face = 1, wig = 0, happy = 0, a = 1, sc = 1, seat = 0;
    const hover = { x: hx - door.dw * 0.2, y: door.doorY - door.dh * 1.25 };
    if (t < TRIP.arrive) {
      const u = ease(seg(t, 0.3, TRIP.arrive));
      bx = lerp(-40, hover.x, u); by = lerp(H * 0.3, hover.y, u) - Math.sin(u * Math.PI) * 40 + Math.sin(t * 5) * 4;
    } else if (t < TRIP.greet) {
      bx = hover.x + Math.sin(t * 3) * 6; by = hover.y + Math.sin(t * 5) * 4; wig = 1; happy = 1;
    } else if (t < TRIP.land) {
      const u = ease(seg(t, TRIP.greet, TRIP.land)); bx = lerp(hover.x, sill.x - door.dw * 0.9, u); by = lerp(hover.y, sill.y, u); flying = u < 0.85; seat = u;
    } else if (t < TRIP.walkIn) {   // little steps in through the door
      const u = seg(t, TRIP.land, TRIP.walkIn);
      bx = lerp(sill.x - door.dw * 0.9, sill.x, u); by = sill.y - Math.abs(Math.sin(u * Math.PI * 5)) * 3 - u * door.dh * 0.25;
      flying = false; seat = 1; sc = 1 - u * 0.25; a = 1 - clamp((u - 0.45) / 0.55, 0, 1);
    } else if (t < TRIP.inside) {
      a = 0; bx = sill.x; by = sill.y;
      // puffs of golden pollen from the doorway
      if (Math.random() < 0.5) {
        const an = rand(-Math.PI, 0);
        T.sparks = T.sparks || [];
        T.sparks.push({ x: door.doorX + rand(-6, 6), y: door.doorY - door.dh * 0.4, vx: Math.cos(an) * rand(20, 60), vy: Math.sin(an) * rand(30, 70), life: 1 });
      }
    } else if (t < TRIP.walkOut) {
      const u = seg(t, TRIP.inside, TRIP.walkOut);
      bx = lerp(sill.x, sill.x + door.dw * 0.9, u); by = sill.y - Math.abs(Math.sin(u * Math.PI * 5)) * 3 - (1 - u) * door.dh * 0.25;
      flying = false; seat = 1; sc = 0.75 + u * 0.25; a = clamp(u / 0.5, 0, 1);
    } else if (t < TRIP.wiggle) {
      bx = sill.x + door.dw * 0.9; by = sill.y; flying = false; seat = 1; wig = 1; happy = 1;
      face = Math.sin(t * 6) > 0 ? 1 : -1;
    } else {
      const u = ease(seg(t, TRIP.wiggle, TRIP.flyOff + 0.6));
      bx = lerp(sill.x + door.dw * 0.9, W + 50, u); by = lerp(sill.y, H * 0.22, u) - Math.sin(u * Math.PI) * 30 + Math.sin(t * 5) * 3;
      happy = 1;
    }
    // golden sparkles
    if (T.sparks) {
      T.sparks.forEach(p => { p.x += p.vx / 60; p.y += p.vy / 60; p.vy += 1.2; p.life -= 1 / 50; });
      T.sparks = T.sparks.filter(p => p.life > 0);
      T.sparks.forEach(p => { ctx.fillStyle = `rgba(255, 210, 70, ${p.life})`; ctx.beginPath(); ctx.arc(p.x, p.y, 3.2, 0, Math.PI * 2); ctx.fill(); });
    }
    if (a > 0.01) {
      ctx.save(); ctx.globalAlpha = alpha * a;
      if (LC) LC.bee.draw(ctx, bx, by, s * sc, face * (Math.PI / 2 + 0.35), 0.15, { t: time, lift: flying ? 0 : SEAT_GROUND, shadow: !flying, flying, tuck: flying ? 1 : 0, seat, wiggle: wig, happy, speed: flying ? 90 : 0 });
      else drawBee(bx, by, { size: s * sc, lift: flying ? 0 : SEAT_GROUND * s * sc, noShadow: flying, faceS: face, vx: flying ? 90 : 0, wiggle: wig, happy, look: null, ph: 0, flying, tuck: flying ? 1 : 0, seat });
      ctx.restore();
    }
    // the buzzing bees on the near side of their loops, pollen motes, little hearts when she drops off
    // her pollen, and soft flowers right up close
    if (door.front) door.front();
    if (t > TRIP.walkIn + 0.25 && !T.hearts) {
      T.hearts = Array.from({ length: 9 }, (_, i) => ({ x: door.doorX + rand(-10, 10), y: door.doorY - door.dh * 0.6, vx: rand(-40, 40), vy: rand(-90, -50), life: 1, r: rand(4, 7), ph: i }));
    }
    if (T.hearts) {
      T.hearts.forEach(h => { h.x += h.vx / 60; h.y += h.vy / 60; h.vx *= 0.98; h.vy *= 0.985; h.life -= 1 / 90; });
      T.hearts = T.hearts.filter(h => h.life > 0);
      T.hearts.forEach(h => {
        const x = h.x + Math.sin(time * 4 + h.ph) * 4, r = h.r;
        ctx.fillStyle = `rgba(255, 140, 170, ${Math.min(1, h.life * 1.5)})`;
        ctx.beginPath(); ctx.moveTo(x, h.y + r * 0.9);
        ctx.bezierCurveTo(x - r * 1.4, h.y, x - r * 0.9, h.y - r * 1.1, x, h.y - r * 0.35);
        ctx.bezierCurveTo(x + r * 0.9, h.y - r * 1.1, x + r * 1.4, h.y, x, h.y + r * 0.9); ctx.fill();
      });
    }
    drawTripMotes(yawT);
    drawTripForeground(yawT);
    // words
    const say = (text, x, y, size) => {
      ctx.font = `800 ${size}px Grandstander, "Chalkboard SE", "Comic Sans MS", sans-serif`; ctx.textAlign = "center";
      ctx.lineWidth = 5; ctx.strokeStyle = "rgba(70, 60, 110, 0.45)"; ctx.strokeText(text, x, y);
      ctx.fillStyle = "#FFFFFF"; ctx.fillText(text, x, y);
    };
    if (t < TRIP.arrive) say("off to the hive!", W / 2, H * 0.16, 24);
    if (t > TRIP.arrive && t < TRIP.greet) say("hi friends!", hx, door.doorY - door.dh * 2.4, 20);
    if (t > TRIP.walkIn && t < TRIP.walkOut) {
      const u = seg(t, TRIP.walkIn + 0.25, TRIP.walkOut);
      ctx.save(); ctx.globalAlpha = alpha * (1 - Math.max(0, u - 0.7) / 0.3);
      say("+1 hive trip!", hx, door.doorY - door.dh * 2.2 - u * 20, 26);
      ctx.restore();
    }
    if (t > TRIP.walkOut + 0.15 && t < TRIP.wiggle) say("bzz bzz!", hx, door.doorY - door.dh * 2.4, 20);
    ctx.restore();
  }

  // ---------- v30: the games menu ----------
  // The animals that have games. A game shows in the menu once it is live (set live: true and its page).
  const GAMES = [
    { id: "frog", name: "Play Lily's Hop Hop", href: PAGES.frog, live: true,
      draw: (g, w, h) => { if (FROG && FROG.draw) FROG.draw(g, w / 2, h * 0.86, h / 74, Math.PI + 0.35, 0.32, { happy: 1, shadow: false }); } },
    { id: "bee", name: "The bee game", href: null, live: false,
      draw: (g, w, h) => { if (LC && LC.bee) LC.bee.draw(g, w / 2, h * 0.52, h / 64, Math.PI / 2 + 0.6, 0.3, { t: 0, ph: 0, pal: 0, happy: 1 }); } },
    { id: "bunny", name: "The bunny game", href: null, live: false,
      draw: (g, w, h) => { if (LC && LC.bunny) LC.bunny.draw(g, w / 2, h * 0.9, h / 44, Math.PI / 2 + 0.5, 0.3, {}); } }
  ];
  const gamesBtn = document.getElementById("gamesBtn"), gamesMenu = document.getElementById("gamesMenu"), gamesIcon = document.getElementById("gamesIcon");
  const iconDpr = () => Math.min(3, Math.max(2, window.devicePixelRatio || 1));
  function paintIcon(cv, css, fn, fill = 0.8) {
    const d = iconDpr(), n = Math.round(css * d); cv.width = cv.height = n;
    const g = cv.getContext("2d"); g.clearRect(0, 0, n, n);
    // draw it on a roomy scratch canvas first, then find exactly where the picture is
    const big = n * 2, t = document.createElement("canvas"); t.width = t.height = big;
    const tg = t.getContext("2d");
    try { tg.translate(big / 4, big / 4); fn(tg, n, n); } catch (_) { return; }
    let x0 = big, y0 = big, x1 = -1, y1 = -1;
    try {
      const px = tg.getImageData(0, 0, big, big).data;
      for (let y = 0; y < big; y++) for (let x = 0; x < big; x++) if (px[(y * big + x) * 4 + 3] > 12) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    } catch (_) { g.drawImage(t, -big / 4, -big / 4); return; }
    if (x1 < x0) return;
    const w = x1 - x0 + 1, h = y1 - y0 + 1, k = Math.min(n * fill / w, n * fill / h);
    g.imageSmoothingQuality = "high";
    g.drawImage(t, x0, y0, w, h, (n - w * k) / 2, (n - h * k) / 2, w * k, h * k);   // exactly in the middle
  }
  // the tiny playhouse, drawn from the playhouse's one design
  paintIcon(gamesIcon, 34, (g, w, h) => { if (window.LilyPlayhouse) window.LilyPlayhouse.drawIcon(g, w / 2, h / 2, h * 0.9, 0); }, 0.84);
  let gamesTimer = 0, gamesFade = 0;
  function closeGames() {
    clearTimeout(gamesTimer); clearTimeout(gamesFade);
    gamesMenu.classList.add("fade");
    gamesBtn.setAttribute("aria-expanded", "false");
    gamesFade = setTimeout(() => { gamesMenu.hidden = true; gamesMenu.classList.remove("fade"); }, 800);
  }
  function openGames() {
    clearTimeout(gamesTimer); clearTimeout(gamesFade);
    gamesMenu.innerHTML = "";
    GAMES.filter(gm => gm.live && gm.href).forEach(gm => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "game-item"; b.setAttribute("aria-label", gm.name); b.title = gm.name;
      const cv = document.createElement("canvas"); cv.setAttribute("aria-hidden", "true"); b.appendChild(cv);
      paintIcon(cv, 38, gm.draw, 0.86);
      b.addEventListener("pointerdown", e => e.stopPropagation());
      b.addEventListener("click", e => { e.stopPropagation(); closeGames(); openPage(gm.href); });
      gamesMenu.appendChild(b);
    });
    gamesMenu.classList.remove("fade"); gamesMenu.hidden = false;
    gamesBtn.setAttribute("aria-expanded", "true");
    gamesTimer = setTimeout(closeGames, 10000);   // it fades away by itself after 10 seconds
  }
  gamesBtn.addEventListener("pointerdown", e => e.stopPropagation());
  gamesBtn.addEventListener("click", e => { e.stopPropagation(); if (gamesMenu.hidden || gamesMenu.classList.contains("fade")) openGames(); else closeGames(); });
  gamesMenu.addEventListener("pointerdown", e => e.stopPropagation());

  // ---------- loop ----------
  let last = performance.now();
  window.__playhouse = { cam: () => ({ x: camX, y: camY, yaw: camYaw }) };
  // In a background tab the browser stops drawing, but the world keeps going: a little tick every second.
  let bgTick = null;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { if (!bgTick) bgTick = setInterval(() => { for (let i = 0; i < 20; i++) update(0.05); }, 1000); }
    else { clearInterval(bgTick); bgTick = null; last = performance.now(); }
  });
  // v24: smooth on every screen. The loop watches how long frames take. If they're slow (a busy iPad), the
  // picture gets a little less sharp so movement stays smooth; when there's room again, it sharpens back up.
  const perf = { avg: 16.7, t: 0, good: 0, drops: 0 };
  function tunePerf(ms) {
    if (ms > 250) return;   // back from a hidden tab: not a slow frame
    perf.avg += (ms - perf.avg) * 0.06; perf.t += ms;
    if (perf.t < 1200) return;
    perf.t = 0;
    if (perf.avg > 24 && dpr > 1) { dprCap = Math.max(1, dpr - 0.25); perf.good = 0; perf.drops++; resize(); }
    else if (perf.avg < 17.5 && dpr < dprBest && perf.drops < 5) { perf.good += 1200; if (perf.good > 7000) { dprCap = dpr + 0.25; perf.good = 0; resize(); } }
    else perf.good = 0;
  }
  function frame(now) {
    const ms = now - last;
    const dt = clamp(ms / 1000, 0, 0.05);
    last = now;
    tunePerf(ms);
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  window.__perf = () => ({ dpr, dprBest, avg: Math.round(perf.avg * 10) / 10, chunks: chunks.size });
  resize();
  draw();
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
})();
</script>
</body>
</html>
